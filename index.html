<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>SMOS · 온보딩 현황</title>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<script src="https://accounts.google.com/gsi/client" async></script>
<style>
  :root{
    --bg:#F2F6FF; --surface:#FFFFFF; --surface-2:#F7F9FE;
    --border:#D6E2F8; --border-strong:#B4CCF8;
    --ink:#1A1D29; --ink-2:#3D5080; --muted:#8A95B5;
    --accent:#3176FD; --accent-2:#0746CA; --accent-tint:#F2F6FF;
    --radius:14px; --radius-sm:10px;
    --mono:ui-monospace,"SF Mono","JetBrains Mono",Menlo,Consolas,monospace;
    --shadow:0 1px 2px rgba(18,38,102,.04), 0 4px 16px rgba(18,38,102,.06);
    --shadow-lg:0 12px 40px rgba(26,29,41,.18);
    --s-recv-t:#0C3698; --s-recv-b:#F2F6FF; --s-recv-d:#6196FD;
    --s-rev-t:#8A5A08;  --s-rev-b:#FFF8E1;  --s-rev-d:#D99A0B;
    --s-vaw-t:#B0450D;  --s-vaw-b:#FCEBDF;  --s-vaw-d:#EA6A1C;
    --s-vac-t:#0746CA;  --s-vac-b:#C8DBFC;  --s-vac-d:#3176FD;
    --s-live-t:#063D2B; --s-live-b:#C9F7E1; --s-live-d:#00C592;
    --s-rej-t:#B42318;  --s-rej-b:#FCEBEA;  --s-rej-d:#E5533F;
    /* 순위 램프(집중도). 1위가 가장 진하다 — 순서 자체가 정보라 색상은 명도 단계로 간다. */
    --rk1:#0746CA; --rk2:#2C6BF0; --rk3:#5B93F8; --rk4:#8FB7FC; --rk5:#C0D6FE; --rk-rest:#E3EAF8;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
    background:var(--bg); color:var(--ink); -webkit-font-smoothing:antialiased; line-height:1.45;
    overflow-x:hidden; -webkit-tap-highlight-color:transparent;}
  .wrap{max-width:620px; margin:0 auto; min-height:100%; display:flex; flex-direction:column;}

  header{position:sticky; top:0; z-index:20;
    background:rgba(242,246,255,.88); backdrop-filter:saturate(180%) blur(12px); -webkit-backdrop-filter:saturate(180%) blur(12px);
    border-bottom:1px solid var(--border); padding:calc(env(safe-area-inset-top) + 13px) 16px 0;}
  .brand{display:flex; align-items:center; justify-content:space-between; gap:12px;}
  .brand-l{display:flex; flex-direction:column; gap:1px; min-width:0;}
  .brand-title{font-size:19px; font-weight:750; letter-spacing:-.02em; display:flex; align-items:center; gap:8px;}
  .brand-mark{font-family:var(--mono); font-size:11px; font-weight:700; letter-spacing:.08em; color:var(--accent); background:var(--accent-tint); padding:3px 7px; border-radius:6px;}
  .brand-sub{font-size:11.5px; color:var(--muted); font-family:var(--mono);}
  .sync{display:inline-flex; align-items:center; gap:6px; cursor:pointer;}
  .sync .sdot{width:7px; height:7px; border-radius:50%; background:var(--muted); flex:none;}
  .sync.live{color:var(--s-live-t);}
  .sync.live .sdot{background:var(--s-live-d); animation:pulse 2s infinite;}
  .sync.off{color:var(--s-rej-t);}
  .sync.off .sdot{background:var(--s-rej-d);}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(0,197,146,.5)}70%{box-shadow:0 0 0 6px rgba(0,197,146,0)}100%{box-shadow:0 0 0 0 rgba(0,197,146,0)}}
  .lang-toggle{display:inline-flex; background:var(--surface); border:1px solid var(--border-strong); border-radius:9px; padding:3px; gap:2px; flex:none;}
  .lang-toggle button{border:0; background:transparent; font:inherit; font-size:12.5px; font-weight:600; color:var(--ink-2); padding:5px 11px; border-radius:6px; cursor:pointer; transition:all .15s;}
  .lang-toggle button.on{background:var(--ink); color:#fff;}

  .tabs{display:flex; gap:4px; margin-top:13px; background:var(--surface); border:1px solid var(--border-strong); border-radius:11px; padding:3px;}
  .tabs button{flex:1; border:0; background:transparent; font:inherit; font-size:13.5px; font-weight:650; color:var(--ink-2); padding:9px; border-radius:8px; cursor:pointer; transition:all .15s; display:flex; align-items:center; justify-content:center; gap:7px;}
  .tabs button .tcnt{font-family:var(--mono); font-size:11px; font-weight:700; opacity:.6;}
  .tabs button.on{background:var(--ink); color:#fff;}

  .search{margin-top:11px; position:relative;}
  .search svg{position:absolute; left:12px; top:50%; transform:translateY(-50%); color:var(--muted);}
  .search input{width:100%; height:44px; border:1px solid var(--border-strong); background:var(--surface); border-radius:11px; padding:0 14px 0 38px; font:inherit; font-size:16px; color:var(--ink); outline:none; transition:border-color .15s, box-shadow .15s;}
  .search input::placeholder{color:var(--muted);}
  .search input:focus{border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-tint);}

  .chips{display:flex; gap:7px; overflow-x:auto; padding:11px 0 12px; scrollbar-width:none; -webkit-overflow-scrolling:touch;}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex:none; display:inline-flex; align-items:center; gap:6px; border:1px solid var(--border-strong); background:var(--surface); color:var(--ink-2); font:inherit; font-size:12.5px; font-weight:600; padding:6px 11px; border-radius:999px; cursor:pointer; transition:all .15s; white-space:nowrap;}
  .chip .cnt{font-family:var(--mono); font-size:11px; font-weight:700; color:var(--muted);}
  .chip .dot{width:7px; height:7px; border-radius:50%;}
  .chip.on{background:var(--ink); border-color:var(--ink); color:#fff;}
  .chip.on .cnt{color:rgba(255,255,255,.7)}

  .toolbar{display:flex; flex-wrap:wrap; gap:7px; padding:0 0 12px;}
  .toolbar button{border:1px solid var(--border-strong); background:var(--surface); color:var(--ink-2); font:inherit; font-size:12px; font-weight:600; padding:6px 11px; border-radius:8px; cursor:pointer; display:inline-flex; align-items:center; gap:5px; transition:all .15s;}
  .toolbar button:hover{background:var(--surface-2); border-color:var(--accent); color:var(--accent);}
  .toolbar button.sort-on{background:var(--accent-tint); border-color:var(--accent); color:var(--accent);}

  main{flex:1; padding:14px 16px calc(env(safe-area-inset-bottom) + 24px);}
  .group{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); margin-bottom:11px; box-shadow:var(--shadow); overflow:hidden;}
  .group-head{display:flex; align-items:center; gap:11px; padding:13px 15px; cursor:pointer; user-select:none; transition:background .12s;}
  .group-head:hover{background:var(--surface-2);}
  .group-head:active{background:#F1F3F6;}
  .chev{flex:none; color:var(--muted); transition:transform .22s cubic-bezier(.3,.7,.3,1);}
  .group.open .chev{transform:rotate(90deg);}
  .group-name{font-size:15px; font-weight:700; letter-spacing:-.01em; flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .group-meta{display:flex; flex-direction:column; align-items:flex-end; gap:5px; flex:none;}
  .ratio{display:flex; align-items:center; gap:7px;}
  .ratio-bar{width:52px; height:5px; border-radius:3px; background:var(--s-rej-b); overflow:hidden;}
  .ratio-bar i{display:block; height:100%; background:var(--s-live-d); border-radius:3px;}
  .ratio-txt{font-family:var(--mono); font-size:11px; font-weight:600; color:var(--muted);}
  .attn-cnt{font-family:var(--mono); font-size:10px; font-weight:700; color:var(--s-vaw-t); background:var(--s-vaw-b); padding:1px 6px; border-radius:4px;}

  .rows{max-height:0; overflow:hidden; transition:max-height .3s cubic-bezier(.3,.7,.3,1);}
  .group.open .rows{max-height:20000px;}
  .rows-inner{padding:0 8px 8px;}

  .item{border-top:1px solid var(--border);}
  .item-row{display:flex; align-items:center; gap:11px; padding:11px 8px; cursor:pointer; border-radius:10px; transition:background .12s;}
  .item-row:hover{background:var(--surface-2);}
  .item-row:active{background:#F1F3F6;}
  .item.attn-high .item-row{border-left:3px solid var(--s-rej-d); margin-left:-3px;}
  .item-main{flex:1; min-width:0; display:flex; flex-direction:column; gap:6px;}
  .item-name{font-size:14.5px; font-weight:600; letter-spacing:-.01em; line-height:1.35; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;}
  .item-sub{display:flex; align-items:center; gap:6px; flex-wrap:wrap;}
  .mid{font-family:var(--mono); font-size:10.5px; font-weight:600; color:var(--muted);}
  .bank-chip{font-size:10.5px; font-weight:650; color:var(--s-info-t,var(--accent)); background:var(--s-info-b,color-mix(in srgb, var(--accent) 12%, transparent)); padding:2px 7px; border-radius:5px;}
  .reason-chip{font-size:10.5px; font-weight:650; color:var(--s-rej-t); background:var(--s-rej-b); padding:2px 7px; border-radius:5px;}
  /* 조용해짐 — 거절(빨강)이 아니라 주의(주황)다. 실패가 아니고 후속 대상이라는 뜻이다. */
  .quiet-chip{font-size:10.5px; font-weight:700; color:var(--s-vaw-t); background:var(--s-vaw-b); padding:2px 7px; border-radius:5px;}
  .va-flag{font-family:var(--mono); font-size:10px; font-weight:700; padding:2px 6px; border-radius:5px;}
  .va-yes{color:var(--s-vac-t); background:var(--s-vac-b); cursor:pointer; transition:all .12s;}
  .va-yes:active{transform:scale(.95);}
  .va-copy{display:inline-flex; align-items:center; gap:6px; cursor:pointer; padding:5px 10px; background:var(--accent-tint); border:1px solid var(--border); border-radius:8px; transition:all .12s; font-family:var(--mono); font-size:12px; color:var(--ink);}
  .va-copy:active{transform:scale(.97); border-color:var(--accent);}
  .va-copy .copy-ic{color:var(--accent); flex:none; opacity:.5;}
  .url-chip{font-size:10px; font-weight:650; color:var(--accent); background:var(--accent-tint); padding:2px 7px; border-radius:5px; text-decoration:none; white-space:nowrap; display:inline-flex; align-items:center; gap:2px;}
  .url-chip:active{background:#E1E5FB;}

  .tracker{display:flex; align-items:flex-start; padding:6px 12px 10px; margin:0 4px; border-top:1px solid var(--border);}
  .trk-step{display:flex; flex-direction:column; align-items:center; gap:4px; flex:none; min-width:38px;}
  .trk-dot{width:10px; height:10px; border-radius:50%; border:2px solid var(--border-strong); background:var(--surface);}
  .trk-step.done .trk-dot{background:var(--s-live-d); border-color:var(--s-live-d);}
  .trk-step.active .trk-dot{background:var(--accent); border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-tint);}
  .trk-step.fail .trk-dot{background:var(--s-rej-d); border-color:var(--s-rej-d); box-shadow:0 0 0 3px var(--s-rej-b);}
  .trk-lbl{font-size:9px; font-weight:600; color:var(--muted); text-align:center; white-space:nowrap;}
  .trk-step.done .trk-lbl{color:var(--s-live-t);}
  .trk-step.active .trk-lbl{color:var(--accent); font-weight:700;}
  .trk-step.fail .trk-lbl{color:var(--s-rej-t); font-weight:700;}
  .trk-line{flex:1; height:2px; background:var(--border); min-width:8px; margin-top:4px;}
  .trk-line.done{background:var(--s-live-d);}
  .badge{flex:none; display:inline-flex; align-items:center; gap:5px; font-size:11.5px; font-weight:650; padding:4px 9px; border-radius:999px; letter-spacing:-.01em; white-space:nowrap;}
  .badge .bd{width:6px; height:6px; border-radius:50%;}

  /* ---- 입금(deposit) ---- */
  .item-right{flex:none; display:flex; flex-direction:column; align-items:flex-end; gap:5px;}
  .dep-badge{display:flex; flex-direction:column; align-items:flex-end; line-height:1.25;}
  .dep-amt{font-family:var(--mono); font-size:14px; font-weight:700; letter-spacing:-.015em; white-space:nowrap;}
  .dep-meta{font-family:var(--mono); font-size:10px; color:var(--muted); white-space:nowrap;}
  .dep-badge.none .dep-amt{font-size:11.5px; font-weight:650; color:var(--s-vaw-t);}
  .item.no-dep .item-row{border-left:3px solid var(--s-vaw-d); margin-left:-3px;}
  .dep-sum{font-family:var(--mono); font-size:11.5px; font-weight:700; color:var(--ink-2);}
  .dep-warn{font-size:12px; font-weight:650; color:var(--s-vaw-t); background:var(--s-vaw-b); padding:2px 7px; border-radius:4px;}
  .chip.chip-dep.on{background:var(--s-vaw-d); border-color:var(--s-vaw-d); color:#fff;}
  .chip.chip-dep.on .cnt{color:rgba(255,255,255,.85);}
  .act-pill{flex:none; display:inline-flex; align-items:center; gap:5px; font-size:11.5px; font-weight:600;
    color:var(--muted); background:var(--surface-2); border:1px solid var(--border); padding:6px 11px; border-radius:999px; white-space:nowrap;}
  .act-pill b{font-family:var(--mono); font-size:11.5px; color:var(--ink-2);}
  .act-pill i{font-family:var(--mono); font-style:normal; font-size:11px; font-weight:700; color:var(--s-live-d);}
  .dep-share{font-family:var(--mono); font-size:10px; font-weight:700; color:var(--accent);}
  .noonb-tag{font-size:10.5px; font-weight:650; color:var(--muted); background:var(--surface-2);
    border:1px solid var(--border); padding:1px 6px; border-radius:4px; white-space:nowrap;}

  /* ---- 입금 분석 뷰 (집중도 · 추이) ---- */
  .period{display:inline-flex; gap:4px;}
  .period select{font:inherit; font-size:12.5px; font-weight:650; color:var(--ink-2);
    background:var(--surface); border:1px solid var(--border); border-radius:8px;
    padding:7px 8px; cursor:pointer; max-width:112px;}
  .period select:disabled{color:var(--muted); cursor:default;}

  .view-nav{display:flex; gap:4px; background:var(--surface-2); border:1px solid var(--border);
    border-radius:9px; padding:3px; margin:10px 0 0; overflow-x:auto; scrollbar-width:none;}
  .view-nav::-webkit-scrollbar{display:none;}
  .view-nav button{flex:1 0 auto; font:inherit; font-size:12.5px; font-weight:650; color:var(--muted);
    background:none; border:0; padding:8px 11px; border-radius:6px; cursor:pointer; white-space:nowrap;}
  .view-nav button.on{background:var(--surface); color:var(--ink); box-shadow:0 1px 3px rgba(0,0,0,.08);}

  /* 더보기 메뉴 — 테마·언어·백업·주간보고·로그아웃 */
  .brand-r{flex:none; display:flex; align-items:center;}
  .more-btn{font:inherit; font-size:20px; line-height:1; font-weight:700; color:var(--ink-2);
    background:var(--surface); border:1px solid var(--border); width:36px; height:36px;
    border-radius:9px; cursor:pointer; padding:0;}
  .more-btn[aria-expanded="true"]{background:var(--accent-tint); border-color:var(--border-strong); color:var(--accent-2);}
  .more-menu{position:fixed; top:58px; right:12px; z-index:60; width:222px;
    background:var(--surface); border:1px solid var(--border-strong); border-radius:12px;
    box-shadow:var(--shadow-lg); padding:8px; display:flex; flex-direction:column; gap:3px;}
  /* display를 클래스로 주면 hidden 속성(UA 스타일)을 덮어써서 처음부터 열려 보인다. */
  .more-menu[hidden]{display:none;}
  .mm-row{display:flex; align-items:center; justify-content:space-between; gap:10px; padding:4px 7px;}
  .mm-lbl{font-size:12.5px; font-weight:600; color:var(--ink-2);}
  .mm-sep{height:1px; background:var(--border); margin:4px 0;}
  .mm-item{font:inherit; font-size:13px; font-weight:600; color:var(--ink-2); text-align:left;
    background:none; border:0; padding:8px 8px; border-radius:7px; cursor:pointer;}
  .mm-item:hover{background:var(--surface-2); color:var(--ink);}
  .more-menu .user-pill{margin:2px 4px;}
  .dp{display:flex; flex-direction:column; gap:12px;}
  .dp-card{background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:13px;}
  .dp-head{display:flex; align-items:baseline; gap:8px; margin-bottom:11px;}
  .dp-title{font-size:13px; font-weight:700; color:var(--ink);}
  .dp-aside{margin-left:auto; font-family:var(--mono); font-size:11px; color:var(--muted);}
  .dp-kpis{display:grid; grid-template-columns:repeat(3,1fr); gap:8px;}
  .dp-kpi{background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:10px 11px;}
  .dp-kpi dt{font-size:10.5px; font-weight:650; color:var(--muted); text-transform:uppercase; letter-spacing:.04em;}
  .dp-kpi dd{margin:3px 0 0; font-family:var(--mono); font-size:19px; font-weight:700; color:var(--ink); letter-spacing:-.02em;}
  .dp-kpi dd small{font-size:11px; font-weight:600; color:var(--muted); margin-left:2px;}
  .dp-stack{display:flex; height:13px; border-radius:7px; overflow:hidden; background:var(--surface-2); margin-bottom:10px;}
  .dp-stack i{display:block; height:100%;}
  .dp-leg{display:flex; flex-direction:column; gap:6px;}
  .dp-li{display:flex; align-items:center; gap:7px; font-size:12px;}
  .dp-li i{width:9px; height:9px; border-radius:3px; flex:none;}
  .dp-li .nm{flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:var(--ink-2);}
  .dp-li .nm em{font-family:var(--mono); font-style:normal; font-size:10px; color:var(--muted); margin-left:5px;}
  .dp-li .sh{font-family:var(--mono); font-size:11.5px; font-weight:700; color:var(--ink);}
  .dp-note{margin:10px 0 0; font-size:11.5px; line-height:1.6; color:var(--muted);}
  .dp-note b{color:var(--ink-2);}
  .dp-tw{overflow-x:auto; margin:0 -13px; padding:0 13px;}
  .dp-tbl{width:100%; border-collapse:collapse; font-size:12px;}
  .dp-tbl th,.dp-tbl td{padding:6px 7px; border-bottom:1px solid var(--border); text-align:left; white-space:nowrap;}
  .dp-tbl th{font-size:10.5px; font-weight:650; color:var(--muted); text-transform:uppercase; letter-spacing:.03em;}
  .dp-tbl td.n,.dp-tbl th.n{text-align:right; font-family:var(--mono); font-variant-numeric:tabular-nums;}
  .dp-tbl td.nm{max-width:170px; overflow:hidden; text-overflow:ellipsis;}
  .dp-tbl tr.mark td{border-bottom:2px solid var(--accent);}
  .dp-tbl tr.go{cursor:pointer;}
  .dp-tbl tr.go:hover td{background:var(--surface-2);}
  .dp-tbl tr.go:active td{background:var(--accent-tint);}
  .dp-tbl td.fi{color:var(--muted); font-size:11px; max-width:110px; overflow:hidden; text-overflow:ellipsis;}
  .dp-bar{display:flex; align-items:center; gap:9px; margin-bottom:6px;}
  .dp-bar .mo{font-family:var(--mono); font-size:11px; font-weight:650; color:var(--ink-2); width:52px; flex:none;}
  /* 클라이언트 이름은 월(26-01)보다 길다. 같은 막대를 쓰고 라벨 폭만 넓힌다. */
  .dp-bar.wide .mo{width:100px; font-family:inherit; font-size:11.5px; font-weight:600;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .dp-bar .tk{flex:1; display:flex; height:17px; background:var(--surface-2); border-radius:5px; overflow:hidden;}
  .dp-bar .tk i{display:block; height:100%;}
  .dp-bar .v{font-family:var(--mono); font-size:10.5px; font-weight:700; color:var(--muted);
    flex:none; min-width:62px; text-align:right; font-variant-numeric:tabular-nums;}
  .dp-mini{display:inline-flex; gap:3px; margin-left:auto;}
  .dp-mini button{font:inherit; font-size:11px; font-weight:650; color:var(--muted); background:var(--surface-2);
    border:1px solid var(--border); padding:3px 9px; border-radius:6px; cursor:pointer;}
  .dp-mini button.on{background:var(--accent); border-color:var(--accent); color:#fff;}
  .dp-inline{display:flex; flex-wrap:wrap; gap:11px; margin-top:9px; font-size:11px; color:var(--muted);}
  .dp-inline span{display:inline-flex; align-items:center; gap:5px;}
  .dp-inline i{width:9px; height:9px; border-radius:3px;}

  .detail{max-height:0; overflow:hidden; transition:max-height .3s cubic-bezier(.3,.7,.3,1);}
  .item.open .detail{max-height:1400px;}
  .detail-inner{padding:2px 10px 15px; display:flex; flex-direction:column; gap:9px;}
  .d-item{display:flex; align-items:baseline; gap:10px;}
  .d-key{font-size:11.5px; color:var(--muted); font-weight:600; width:64px; flex:none;}

  .toast{position:fixed; bottom:calc(env(safe-area-inset-bottom) + 24px); left:50%; transform:translateX(-50%) translateY(10px); background:var(--ink); color:#fff; font-size:13px; font-weight:500; padding:11px 18px; border-radius:11px; z-index:60; opacity:0; pointer-events:none; transition:all .25s; box-shadow:var(--shadow-lg); max-width:90%; text-align:center;}

  [data-theme="dark"]{

<body>
<div class="login-screen" id="loginScreen">

let BACKEND_URL = "https://script.google.com/macros/s/AKfycbyzZj-uD1pW-3YwVkeNlXWl1765zAAs7IHn-pAGa23Axb4fbWjfVoEHsMfM8GdiYcZYag/exec";
const GOOGLE_CLIENT_ID = "690250277277-otqse7oa1ro37uhut34ja9fp43dmkpge.apps.googleusercontent.com";
const POLL_SECONDS = 30;

const Auth = {
  token: null,
  email: null,
  name: null,
  picture: null,
  role: null,
  get loggedIn(){ return !!this.token; },
  set(credential){
    this.token = credential;
    const parts = credential.split(".");
    if(parts.length===3){
      try{
        const p = JSON.parse(atob(parts[1].replace(/-/g,"+").replace(/_/g,"/")));
        this.email = p.email||"";
        this.name = p.name||p.email||"";
        this.picture = p.picture||"";
      }catch(e){}
    }
  },
  clear(){ this.token=null; this.email=null; this.name=null; this.picture=null; this.role=null; },
};

const TONES = {
  slate:{t:'--s-recv-t',b:'--s-recv-b',d:'--s-recv-d'},
  amber:{t:'--s-rev-t', b:'--s-rev-b', d:'--s-rev-d'},
  orange:{t:'--s-vaw-t',b:'--s-vaw-b',d:'--s-vaw-d'},
  blue:{t:'--s-vac-t', b:'--s-vac-b', d:'--s-vac-d'},
  green:{t:'--s-live-t',b:'--s-live-b',d:'--s-live-d'},

};

const STRINGS = {

    currency:"USD", depJoin:"name",
    /* VND는 요청일(Submission Request Date)이 40/93건뿐이라 온보딩 소요일을 계산하지 않는다.
       활성화는 VA 발급일 71/93으로 채워진 만큼만 낸다 — 없는 건은 추정하지 않고 비운다. */
    actAnchor:"vaDate", actAnchorLabel:"leadActSubVa",
  },
};

/* ============================ Data layer ============================ */
const Store = {
  data:{KRW:[],VND:[]}, online:false, authError:false, lastSync:null,
  async fetchRemote(){ const url=BACKEND_URL+(Auth.token?"?token="+encodeURIComponent(Auth.token):""); const r=await fetch(url,{cache:"no-store"}); if(!r.ok) throw new Error("http "+r.status); return await r.json(); },
  async load(){
    if(BACKEND_URL && Auth.loggedIn){ try{ const d=await this.fetchRemote(); if(d.error){ console.warn("backend auth error:",d.message); this.online=false; this.authError=d.error==="forbidden"?"forbidden":"auth"; return; } if(d._user){ Auth.role=d._user.role; delete d._user; } this.data=d; this.online=true; this.authError=false; this.lastSync=Date.now(); ensureIds(this.data); return; }catch(e){ console.warn("backend load failed",e); this.online=false; } }
    this.data={KRW:[],VND:[]};
  },
  rows(){ return this.data[active] || (this.data[active]=[]); },
};
function ensureIds(d){ for(const k in d){ const v=d[k]; if(Array.isArray(v)) v.forEach(r=>{ if(!r.id) r.id=uid(); }); } }
async function refresh(){
  if(!BACKEND_URL || !Auth.loggedIn) return;
  if(backdrop.classList.contains("show")) return;
  try{ const d=await Store.fetchRemote(); if(d.error){ Store.online=false; Store.authError=d.error==="forbidden"?"forbidden":"auth"; updateSync(); return; } if(d._user){ Auth.role=d._user.role; delete d._user; } ensureIds(d); Store.data=d; Store.online=true; Store.authError=false; Store.lastSync=Date.now();
       const y=window.scrollY; render(); window.scrollTo(0,y); }
  catch(e){ Store.online=false; updateSync(); }
}
function rel(ts){ if(!ts) return L("syncWait"); const s=Math.floor((Date.now()-ts)/1000);
  if(s<10) return L("justNow"); if(s<60) return s+L("secAgo"); const m=Math.floor(s/60); if(m<60) return m+L("minAgo"); return Math.floor(m/60)+L("hrAgo"); }
function updateSync(){ const el=$("#syncPill"), w=$("#syncWrap"); if(!el||!w) return;
  if(!BACKEND_URL){ w.className="brand-sub sync off"; el.textContent=L("noBackend"); }
  else if(!Auth.loggedIn){ w.className="brand-sub sync off"; el.textContent=L("notLoggedIn"); }
  else if(Store.authError){ w.className="brand-sub sync off"; el.textContent=Store.authError==="forbidden"?L("forbidden"):L("authError"); }
  else if(Store.online){ w.className="brand-sub sync live"; el.textContent=L("live")+rel(Store.lastSync); }
  else { w.className="brand-sub sync off"; el.textContent=L("disconnected"); }
}

const $ = s=>document.querySelector(s);
const esc = s=>String(s??"").replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = ()=>Math.random().toString(36).slice(2,9);
const CORR = ()=>CORRIDORS[active];
const colOf = role=>CORR().columns.find(c=>c.role===role);
const groupField=()=>colOf("group").field;
const nameField =()=>colOf("name").field;
const colLabel = c => lang==="EN" ? (c.labelEn||c.label) : c.label;
function statusMeta(v){ const s=CORR().statuses.find(x=>x.v===v); const tone=TONES[s?s.tone:"slate"]; return {label:v||"—", ...tone}; }

/* 입금액 표기 — 코리도별 통화. 절대 합산하지 않는다(KRW vs USD) */
function fmtMoney(v,cur){
  cur = cur || CORR().currency;
  const n = Number(v)||0;
  if(!n) return "";
  if(cur==="KRW"){
    if(lang==="EN"){
      if(n>=1e9) return "₩"+(n/1e9).toFixed(2)+"B";
      if(n>=1e6) return "₩"+(n/1e6).toFixed(1)+"M";
      if(n>=1e3) return "₩"+Math.round(n/1e3).toLocaleString()+"K";
      return "₩"+Math.round(n).toLocaleString();
    }
    if(n>=1e8) return "₩"+(n/1e8).toFixed(1)+"억";
    if(n>=1e4) return "₩"+Math.round(n/1e4).toLocaleString()+"만";
    return "₩"+Math.round(n).toLocaleString();
  }
  if(n>=1e6) return "$"+(n/1e6).toFixed(2)+"M";
  if(n>=1e3) return "$"+(n/1e3).toFixed(1)+"K";
  return "$"+n.toFixed(0);
}
function fmtMoneyFull(v,cur){
  cur = cur || CORR().currency;
  const n = Number(v)||0;
  return cur==="KRW" ? "₩"+Math.round(n).toLocaleString()
                     : "$"+n.toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});
}
/* 승인 완료인데 입금이 0인 건 — Sales 후속 대상 */
const isNoDeposit = r => CORR().success.includes(r.status) && !depOf(r).sum;

/* 백엔드가 내려준 코리도별 입금 메타(_dep). 없으면 빈 값으로 동작해 구 백엔드와도 깨지지 않는다. */
function DEP(){ return (Store.data && Store.data._dep && Store.data._dep[active]) || {}; }

/* 입금은 있는데 온보딩 탭에 행이 없는 머천트를 목록에 올릴 행으로 바꾼다.
 * id는 키에서 만들어 렌더마다 같아야 한다 — 안 그러면 펼친 상태가 풀린다. */
function orphanRows(){
  const nf=nameField(), gf=groupField(), byMid=CORR().depJoin==="mid";
  return (DEP().orphans||[]).map(o=>{
    const r={ id:"orph-"+o.key, status:"", noOnboarding:true, client:o.client||"",
      depSum:o.depSum, depCnt:o.depCnt, depLast:o.depLast, depM:o.depM||null, depVaType:o.depVaType||"" };
    if(byMid) r.merchantId=o.key;
    r[nf]=o.name; r[gf]=o.client||L("noGroup");
    return r;
  });
}

/* ---- 기간 필터 ----
 * 원천에 2024년부터 들어와 전체 누적만 보여주면 "올해 얼마 들어왔나"를 알 수 없다.
 * 머천트별 월 내역(depM)을 받아 화면에서 기간을 다시 계산한다. 백엔드 재호출이 없다.
 * 경보는 이 필터와 무관하게 항상 최신 기준으로 판단한다 — 화면 상태가 알림을 바꾸면 안 된다. */
let perYear = String(new Date().getFullYear());   // 디폴트: 올해
let perMonth = "";                                 // "" = 전체 월

/* 데이터에 실제로 존재하는 연도. 없는 연도를 고르게 하지 않는다. */
function depYears(){
  const set=new Set();
  Store.rows().concat(orphanRows()).forEach(r=>{
    Object.keys(r.depM||{}).forEach(mo=>set.add(mo.slice(0,4)));
  });
  (DEP().months||[]).forEach(m=>set.add(m.mo.slice(0,4)));
  return [...set].sort().reverse();
}
function periodLabel(){
  if(!perYear) return L("perAll");
  return perMonth ? `${perYear}-${perMonth}` : `${perYear}`;
}
/* 선택 기간이 이 월을 포함하나 */
function inPeriod(mo){
  if(!perYear) return true;
  if(mo.slice(0,4)!==perYear) return false;
  return !perMonth || mo.slice(5,7)===perMonth;
}

/* 행의 기간 내 입금 — 금액·건수·기간 내 마지막 입금일. depM이 없으면 전체값으로 떨어진다
   (구 백엔드 호환). */
function depOf(r){
  const m=r.depM;
  if(!m) return { sum:Number(r.depSum)||0, cnt:Number(r.depCnt)||0, last:r.depLast||"" };
  let sum=0, cnt=0, last="";
  Object.keys(m).forEach(mo=>{
    if(!inPeriod(mo)) return;
    sum+=m[mo][0]; cnt+=m[mo][1];
    if(m[mo][2]>last) last=m[mo][2];
  });
  return { sum:Math.round(sum*100)/100, cnt, last };
}

/* 기간 내 전체 입금액 — 점유율의 분모. 보드 행 + 고아를 조인 키로 접어 센다. */
function depTotal(){
  const seen=new Set(); let t=0;
  Store.rows().concat(orphanRows()).forEach(r=>{
    const k=depKeyOf(r)||r.id;
    if(seen.has(k)) return;
    seen.add(k);
    t+=depOf(r).sum;
  });
  return t;
}

function renderPeriod(){
  const years=depYears();
  const ySel=$("#perYear"), mSel=$("#perMonth");
  if(!years.length){ $(".period").style.display="none"; return; }
  $(".period").style.display="";
  if(perYear && years.indexOf(perYear)<0) perYear=years[0];   // 올해 데이터가 없으면 최신 연도로
  ySel.innerHTML=[`<option value="">${L("perAll")}</option>`]
    .concat(years.map(y=>`<option value="${y}"${y===perYear?" selected":""}>${y}</option>`)).join("");
  mSel.disabled=!perYear;
  mSel.innerHTML=[`<option value="">${L("perAllMonths")}</option>`]
    .concat(Array.from({length:12},(_,i)=>{
      const mm=String(i+1).padStart(2,"0");
      return `<option value="${mm}"${mm===perMonth?" selected":""}>${L("perMonthFmt")(i+1)}</option>`;
    })).join("");
}
$("#perYear").addEventListener("change",e=>{ perYear=e.target.value; if(!perYear) perMonth=""; render(); });
$("#perMonth").addEventListener("change",e=>{ perMonth=e.target.value; render(); });

/* 보드 행 → 입금 집계 키. 백엔드 normName_과 같은 규칙이어야 한다. */
function depKeyOf(r){
  if(CORR().depJoin==="mid") return String(r.merchantId||"").trim();
  return String(r[nameField()]||"").toUpperCase().replace(/^SB\s+/,"").replace(/[^A-Z0-9]/g,"");
}

/* ---- 조용해짐 ----
 * 거래하던 머천트가 멈춘 것. 판정은 백엔드가 하고(quietRows_) 화면은 받아 쓴다 —
 * Slack 경보와 같은 함수라 "왜 알림은 안 왔지"가 생기지 않는다.
 * 기간 필터를 걸어도 값이 바뀌지 않는다: 경보는 항상 오늘 기준이어야 한다. */
function quietOf(r){
  const q=DEP().quiet;
  if(!q) return null;
  const v=q[depKeyOf(r)];
  return v ? { band:v[0], days:v[1] } : null;
}

/* 전체 입금액 대비 점유율. 분모는 백엔드 합계라 화면 필터에 흔들리지 않는다. */
function depShare(v){
  const t=depTotal();
  return t ? (Number(v)||0)/t*100 : 0;
}

function stepOf(r){
  const c=CORR(); if(!c.steps) return null;
  const n=c.steps.length;
  const states=new Array(n).fill("pending");
  states[0]="done";
  if(active==="KRW"){
    if(r.status==="KYC"||r.status==="Ops confirming"){ states[1]="active"; }
    else if(r.status==="Succeeded"){ states[1]="done"; states[2]="done"; if(r.va&&r.va!=="N") states[3]="done"; }
    else if(r.status==="Failed"){ states[1]="done"; states[2]="fail"; }
  } else if(active==="VND"){
    if(r.status==="In progress"){ states[1]="active"; }
    else if(r.status==="Approved"){ states[1]="done"; states[2]="done"; if(r.va&&r.va!=="N") states[3]="done"; }
    else if(r.status==="Rejected / Offboarded"){ states[1]="done"; states[2]="fail"; }
  }
  return {states, steps:c.steps};
}
function stepTracker(r){
  const info=stepOf(r); if(!info) return "";
  const {states,steps}=info;
  const sLbl=s=>lang==="EN"?(s.labelEn||s.label):s.label;
  let h='<div class="tracker">';
  steps.forEach((s,i)=>{
    h+=`<div class="trk-step ${states[i]}"><div class="trk-dot"></div><div class="trk-lbl">${sLbl(s)}</div></div>`;
    if(i<steps.length-1){ const ld=states[i]==="done"&&states[i+1]!=="pending"; h+=`<div class="trk-line${ld?" done":""}"></div>`; }
  });
  return h+"</div>";
}
function isAttention(r){
  const fail=CORR().statuses.filter(s=>s.tone==="rose").map(s=>s.v);
  if(fail.includes(r.status)) return "high";
  return null;
}
function buildSummary(r){
  const name=r[nameField()]||"—";
  const mid=r.merchantId?` (${r.merchantId})`:"";
  const status=r.status||"—";
  const va=r.va?` · ${L("vaIssued")}`:"";
  const info=stepOf(r);
  let stepStr="";
  if(info){
    const ai=info.states.indexOf("active"), fi=info.states.indexOf("fail");
    const sLbl=s=>lang==="EN"?(s.labelEn||s.label):s.label;
    if(ai>=0) stepStr=` · ${ai+1}/${info.steps.length} ${sLbl(info.steps[ai])}`;
    else if(fi>=0) stepStr=` · ${sLbl(info.steps[fi])} ${lang==="EN"?"failed":"실패"}`;
  }
  const rc=CORR().columns.find(c=>c.type==="reason");
  const reason=rc&&r[rc.field]?` · ${r[rc.field]}`:"";
  const dep=Number(r.depSum)||0;
  const depStr=dep?` · ${L("depTotal")} ${fmtMoney(dep)}${r.depCnt?`(${r.depCnt})`:""}`
                  :isNoDeposit(r)?` · ${L("noDeposit")}`:"";
  return `${name}${mid} — ${status}${va}${reason}${stepStr}${depStr}`;
}
function clipCopy(text,msg){ navigator.clipboard.writeText(text).then(()=>toast(msg)).catch(()=>{const t=document.createElement("textarea");t.value=text;t.style.position="fixed";t.style.opacity="0";document.body.appendChild(t);t.select();document.execCommand("copy");document.body.removeChild(t);toast(msg);}); }

let active = "KRW";
let filter = "all";
let query = "";
let sortMode = "deposit";   // 입금이 붙은 뒤로는 "얼마 들어왔나"가 첫 질문이라 입금순이 기본
let depView = "list";       // list | conc | trend
let trendExTop = false;     // 추이에서 최대 머천트를 빼고 볼지
let dashMode = false;
let darkTheme = false;
let forecastMode = false;
let forecastData = null;
const openGroups = new Set();
const openItems = new Set();

/* ============================ Render ============================ */
function statusBadge(v){ const s=statusMeta(v); return `<span class="badge" style="color:var(${s.t});background:var(${s.b})"><span class="bd" style="background:var(${s.d})"></span>${esc(s.label)}</span>`; }

function matchRow(r){
  if(filter==="attention"){ if(!isAttention(r)) return false; }
  else if(filter==="nodeposit"){ if(!isNoDeposit(r)) return false; }
  else if(filter!=="all" && r.status!==filter) return false;
  const q=query.toLowerCase(); if(!q) return true;
  return [nameField(),groupField(),"merchantId"].some(f=>String(r[f]||"").toLowerCase().includes(q));
}

function render(){
  $("#titleText").textContent = "Sub Merchant Onboarding Status";
  $("#search").placeholder = L("search");
  const sortBtn=$("#btnSort");
  sortBtn.textContent = sortMode==="recent"?L("sortRecent"):sortMode==="deposit"?L("sortDeposit"):L("sortGroup");
  sortBtn.classList.toggle("sort-on", sortMode!=="group");
  $("#btnExportCsv").textContent = L("btnExportCsv");
  $("#btnExportJson").textContent = L("btnExportJson");
  $("#btnWeeklyReport").textContent = "📧 "+L("weeklyReport");
  $("#mmTheme").textContent = L("mmTheme");
  $("#mmLang").textContent = L("mmLang");
  // 코리도를 바꾸면 그 코리도에 없는 분석 뷰가 남는다(VND엔 SLA가 없는 등). 목록으로 돌린다.
  if(depView!=="list" && !navItems().some(([v])=>v===depView)) depView="list";
  renderTabs(); updateSync(); renderViewNav(); renderPeriod();
  if(forecastMode){ renderForecast(); return; }
  $("#forecastPanel").style.display="none";
  // 목록이 아닌 화면에서는 목록 도구(검색·칩·정렬)를 내린다. 대시보드도 검색을 쓰지 않는다.
  const noTools = dashMode || depView!=="list";
  const analytic = !dashMode && depView!=="list";   // depPanel을 띄울 화면
  $(".search").style.display=noTools?"none":"";
  $("#chips").style.display=noTools?"none":"";
  $(".toolbar").style.display=noTools?"none":"";
  $("#depPanel").style.display=analytic?"":"none";
  $("#list").style.display=noTools?"none":"";
  $("#dashboard").style.display=dashMode?"":"none";
  if(analytic){ $("#depPanel").innerHTML =
    depView==="conc"?concHTML():depView==="lead"?leadHTML():trendHTML(); return; }
  renderChips();
  if(dashMode){ renderDash(); return; }

  const rows = Store.rows().filter(matchRow);
  const gf=groupField(), nf=nameField();
  const groups={};
  rows.forEach(r=>{ const g=r[gf]||L("noGroup"); (groups[g]=groups[g]||[]).push(r); });
  let names=Object.keys(groups).sort((a,b)=>a.localeCompare(b));

  if(sortMode==="recent"){
    for(const g of names) groups[g].sort((a,b)=>(b.requestDate||"").localeCompare(a.requestDate||""));
    names.sort((a,b)=>{
      const ma=groups[a].reduce((mx,r)=>r.requestDate>mx?r.requestDate:mx,"");
      const mb=groups[b].reduce((mx,r)=>r.requestDate>mx?r.requestDate:mx,"");
      return mb.localeCompare(ma);
    });
  } else if(sortMode==="deposit"){
    const dsum=g=>groups[g].reduce((a,r)=>a+depOf(r).sum,0);
    for(const g of names) groups[g].sort((a,b)=>depOf(b).sum-depOf(a).sum);
    names.sort((a,b)=>dsum(b)-dsum(a));
  }

  let html="";
  if(!names.length){
    html=`<div class="empty"><div class="big">${query||filter!=="all"?L("noResultTitle"):L("noItemTitle")}</div>
      <div class="sm">${query||filter!=="all"?L("noResultSub"):L("noItemSub")}</div></div>`;
  } else {
    const forceOpen = !!(query||filter!=="all");
    for(const g of names){
      const gr=groups[g];
      const succ=gr.filter(r=>CORR().success.includes(r.status)).length;
      const pct=Math.round(succ/gr.length*100);
      const attnCnt=gr.filter(r=>isAttention(r)).length;
      const gDep=gr.reduce((a,r)=>a+depOf(r).sum,0);
      const isOpen = forceOpen || openGroups.has(active+"|"+g);
      html+=`<div class="group ${isOpen?'open':''}" data-g="${esc(g)}">
        <div class="group-head" data-act="tg-group">
          <svg class="chev" width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M5 3l4 4-4 4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span class="group-name">${esc(g)}</span>
          <div class="group-meta">
            ${gDep?`<span class="dep-sum">${fmtMoney(gDep)}</span>`:""}
            ${attnCnt?`<span class="attn-cnt">⚠ ${attnCnt}</span>`:""}
            <div class="ratio"><span class="ratio-txt">${succ}/${gr.length}</span><div class="ratio-bar"><i style="width:${pct}%"></i></div></div>
          </div>
        </div>
        <div class="rows"><div class="rows-inner">
          ${gr.map(r=>itemHTML(r)).join("")}
        </div></div>
      </div>`;
    }
  }
  html += orphanGroupHTML();
  $("#list").innerHTML=html;
}

/* 온보딩 기록 없는 머천트는 클라이언트 그룹에 섞지 않고 맨 아래 별도 그룹으로 둔다.
 * 상태값이 없어 승인율·퍼널 통계에 섞이면 수치가 오염되기 때문이다. */
function orphanGroupHTML(){
  if(filter!=="all") return "";
  let list=orphanRows();
  if(query){
    const q=query.toLowerCase(), nf=nameField();
    list=list.filter(r=>[nf,"merchantId","client"].some(f=>String(r[f]||"").toLowerCase().includes(q)));
  }
  // 이 그룹은 "온보딩 탭에 없는 입금"을 드러내려고 있다. 선택 기간에 입금이 없으면 드러낼 게 없다.
  list=list.filter(r=>depOf(r).sum>0);
  if(!list.length) return "";
  list.sort((a,b)=>depOf(b).sum-depOf(a).sum);
  const sum=list.reduce((a,r)=>a+depOf(r).sum,0);
  const g=L("noOnboarding");
  const isOpen = !!query || openGroups.has(active+"|"+g);
  return `<div class="group ${isOpen?'open':''} g-noonb" data-g="${esc(g)}">
    <div class="group-head" data-act="tg-group">
      <svg class="chev" width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M5 3l4 4-4 4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span class="group-name">${esc(g)}</span>
      <div class="group-meta">
        <span class="dep-sum">${fmtMoney(sum)}</span>
        <div class="ratio"><span class="ratio-txt">${list.length}</span></div>
      </div>
    </div>
    <div class="rows"><div class="rows-inner">
      ${list.map(r=>itemHTML(r)).join("")}
      <p class="dp-note" style="padding:0 10px 10px">${L("noOnboardingNote")}</p>
    </div></div>
  </div>`;
}

function itemHTML(r){
  const key=active+"|"+r.id;
  const isOpen=openItems.has(key);
  const reasonCol=CORR().columns.find(c=>c.type==="reason");
  const reason=reasonCol?r[reasonCol.field]:"";
  const mid=r.merchantId;
  const attn=isAttention(r);
  const attnCls=attn==="high"?"attn-high":"";
  const dp=depOf(r);
  const dep=dp.sum;
  const noDep=isNoDeposit(r);
  const sh = dep ? depShare(dep) : 0;
  const depBadge = dep
    ? `<div class="dep-badge"><span class="dep-amt">${fmtMoney(dep)}</span>${
         sh>=0.05?`<span class="dep-share">${sh.toFixed(1)}%</span>`:""}${
         dp.cnt?`<span class="dep-meta">${dp.cnt}${lang==="EN"?"":"건"}${dp.last?" · "+esc(dp.last.slice(5).replace("-","/")):""}</span>`:""}</div>`
    : noDep ? `<div class="dep-badge none"><span class="dep-amt">${L("noDeposit")}</span></div>` : "";
  return `<div class="item ${isOpen?'open':''} ${attnCls} ${noDep?'no-dep':''}" data-id="${esc(r.id)}">
    <div class="item-row" data-act="tg-item">
      <div class="item-main">
        <div class="item-name">${esc(r[nameField()])||`<span style="color:var(--muted)">${L("noName")}</span>`}</div>
        <div class="item-sub">
          ${mid?`<span class="mid">${esc(mid)}</span>`:``}
          ${r.noOnboarding?`<span class="noonb-tag">${L("noOnboarding")}</span>`:``}
          ${(()=>{const bc=colOf("bank"); return bc&&r[bc.field]?`<span class="bank-chip">${esc(r[bc.field])}</span>`:``})()}
          ${r.va?`<span class="va-flag va-yes" data-act="copy-va" data-va="${esc(r.va)}">VA ✓</span>`:``}
          ${(()=>{const q=quietOf(r); return q?`<span class="quiet-chip" title="${esc(LF("quietVal",q.band,q.days))}">${LF("quietChip",q.days)}</span>`:``})()}
          ${reason?`<span class="reason-chip">${esc(reason)}</span>`:``}
          ${CORR().columns.filter(c=>c.type==="url"&&r[c.field]).map(c=>{const u=r[c.field],href=/^https?:\/\//i.test(u)?u:"https://"+u; return `<a class="url-chip" href="${esc(href)}" target="_blank" rel="noopener" data-act="link">${colLabel(c)} ↗</a>`;}).join("")}
        </div>
      </div>
      <div class="item-right">${depBadge}${r.noOnboarding?"":statusBadge(r.status)}</div>
    </div>
    ${r.noOnboarding?"":stepTracker(r)}
    <div class="detail"><div class="detail-inner">
      ${depDetail(r)}
      ${r.noOnboarding?"":CORR().columns.filter(c=>!c.role || c.role==="status").map(c=>detailRow(r,c)).filter(Boolean).join("")}
      <button class="share-btn" data-act="copy-summary" data-id="${esc(r.id)}">${L("shareLabel")}</button>
    </div></div>
  </div>`;
}

function depDetail(r){
  const dp=depOf(r);
  const dep=dp.sum;
  if(!dep){
    if(!isNoDeposit(r)) return "";
    return `<div class="d-item"><span class="d-key">${L("depTotal")}</span>
      <span class="d-val"><span class="dep-warn">${L("depNone")}</span></span></div>`;
  }
  const sh=depShare(dep);
  let h=`<div class="d-item"><span class="d-key">${L("depTotal")}</span>
    <span class="d-val mono">${fmtMoneyFull(dep)}${sh>=0.05?` <span class="dep-share">${sh.toFixed(2)}%</span>`:""}</span></div>`;
  if(dp.cnt) h+=`<div class="d-item"><span class="d-key">${L("depCount")}</span>
    <span class="d-val mono">${dp.cnt}${lang==="EN"?"":"건"}</span></div>`;
  if(dp.last) h+=`<div class="d-item"><span class="d-key">${L("depLast")}</span>
    <span class="d-val mono">${esc(dp.last)}</span></div>`;
  const q=quietOf(r);
  if(q) h+=`<div class="d-item"><span class="d-key">${L("quietKey")}</span>
    <span class="d-val"><span class="quiet-chip">${esc(LF("quietVal",q.band,q.days))}</span></span></div>`;
  if(r.depVaType) h+=`<div class="d-item"><span class="d-key">${L("depVaType")}</span>
    <span class="d-val">${esc(r.depVaType)}</span></div>`;
  return h;
}

function detailRow(r,c){
  const v=r[c.field];
  const lbl = colLabel(c);
  if(c.role==="status") return `<div class="d-item"><span class="d-key">${lbl}</span><span class="d-val">${statusBadge(r.status)}</span></div>`;
  if(!v) return "";
  let val;
  if(c.type==="url"){ const href=/^https?:\/\//i.test(v)?v:"https://"+v; val=`<a class="link-btn" href="${esc(href)}" target="_blank" rel="noopener">${c.field==="ticket"||c.field==="jira"?L("ticket"):L("open")} ↗</a>`; }
  else if(c.type==="reason") val=`<span class="reason-val">${esc(v)}</span>`;
  else if(c.type==="long") val=`<span class="memo-val">${esc(v)}</span>`;
  else if(c.type==="date"){ val=`<span class="mono">${esc(v)}</span>`; }
  else if(c.field==="va") val=`<span class="va-copy" data-act="copy-va" data-va="${esc(v)}"><span>${esc(v)}</span><svg class="copy-ic" width="13" height="13" viewBox="0 0 16 16" fill="none"><rect x="5.5" y="5.5" width="8" height="8" rx="1.5" stroke="currentColor" stroke-width="1.4"/><path d="M4.5 11V3.5a1.5 1.5 0 011.5-1.5H11" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg></span>`;
  else val=`<span class="${c.mono?'mono':''}">${esc(v)}</span>`;
  return `<div class="d-item"><span class="d-key">${lbl}</span><span class="d-val ${c.mono&&c.type!=='url'?'mono':''}">${val}</span></div>`;
}

/* ---- 집중도: 어느 머천트가 볼륨을 만드는가 ---- */
function concHTML(){
  const meta=DEP(), total=depTotal();
  // 같은 입금 키가 보드에 두 행으로 있으면(예: MID 중복 입력) 같은 돈이 두 번 세어져
  // 점유율 합이 100%를 넘는다. 키 단위로 접어서 센다.
  const seen=new Set();
  const all=Store.rows().concat(orphanRows())
    .map(r=>Object.assign({}, r, { _dep:depOf(r).sum }))
    .filter(r=>r._dep>0)
    .filter(r=>{ const k=depKeyOf(r)||r.id; if(seen.has(k)) return false; seen.add(k); return true; })
    .sort((a,b)=>b._dep-a._dep);
  if(!all.length) return `<div class="dp-card"><p class="dp-note">${L("depEmpty")}</p></div>`;
  const nf=nameField();
  const pct=v=>total?v/total*100:0;

  // 누적 80%에 몇 곳이 필요한가
  let cum=0, need80=0;
  for(const r of all){ cum+=pct(r._dep); need80++; if(cum>=80) break; }

  const top5=all.slice(0,5);
  const restPct=Math.max(0, 100-top5.reduce((a,r)=>a+pct(r._dep),0));
  const stack=top5.map((r,i)=>`<i style="width:${pct(r._dep).toFixed(2)}%;background:var(--rk${i+1})" title="${esc(r[nf])} ${pct(r._dep).toFixed(1)}%"></i>`).join("")
    +(restPct>0?`<i style="width:${restPct.toFixed(2)}%;background:var(--rk-rest)" title="${LF("concRest",all.length-top5.length)} ${restPct.toFixed(1)}%"></i>`:"");
  const leg=top5.map((r,i)=>`<div class="dp-li"><i style="background:var(--rk${i+1})"></i>
      <span class="nm">${esc(r[nf])||L("noName")}${r.merchantId?`<em>${esc(r.merchantId)}</em>`:""}</span>
      <span class="sh">${pct(r._dep).toFixed(2)}%</span></div>`).join("")
    +(all.length>5?`<div class="dp-li"><i style="background:var(--rk-rest)"></i>
      <span class="nm">${LF("concRest",all.length-5)}</span><span class="sh">${restPct.toFixed(2)}%</span></div>`:"");

  // 클라이언트별
  const gf=groupField(), byC={};
  all.forEach(r=>{ const c=r[gf]||L("noGroup"); (byC[c]=byC[c]||{s:0,n:0}).s+=r._dep; byC[c].n++; });
  const cl=Object.keys(byC).map(c=>[c,byC[c].s,byC[c].n]).sort((a,b)=>b[1]-a[1]);
  const clHTML=cl.map(([c,s,n],i)=>`<div class="dp-li"><i style="background:var(--rk${Math.min(i+1,5)})"></i>
      <span class="nm">${esc(c)}<em>${n}${lang==="EN"?"":"곳"}</em></span>
      <span class="sh">${pct(s).toFixed(2)}%</span></div>`).join("");

  // 상위 테이블. 행을 누르면 머천트 목록에서 그 머천트만 펼쳐 보여준다(티켓·상태 확인용).
  const rows=all.slice(0,15);
  let c2=0;
  const tr=rows.map((r,i)=>{ c2+=pct(r._dep);
    return `<tr class="go ${i===need80-1?"mark":""}" data-act="goto-merchant" data-id="${esc(r.id)}"
        data-q="${esc(r.merchantId||r[nf]||"")}" title="${esc(r[nf])}">
      <td class="n">${i+1}</td>
      <td class="nm">${esc(r[nf])||L("noName")}</td>
      <td class="fi">${esc(r[gf]||L("noGroup"))}</td>
      <td class="n">${fmtMoney(r._dep)}</td>
      <td class="n">${pct(r._dep).toFixed(2)}%</td>
      <td class="n">${c2.toFixed(1)}%</td></tr>`; }).join("");

  // 승인 곳수도 같은 키 기준으로 센다. 위의 "머천트 N곳"과 한 문장에 나오므로 기준이 달라선 안 된다.
  const apprKeys=new Set(), depKeys=new Set();
  Store.rows().forEach(r=>{
    if(!CORR().success.includes(r.status)) return;
    const k=depKeyOf(r)||r.id;
    apprKeys.add(k);
    if(depOf(r).sum>0) depKeys.add(k);
  });
  const appr=apprKeys.size, withDep=depKeys.size;

  return `
  <div class="dp-kpis">
    <div class="dp-kpi"><dt>${L("concTop1")}</dt><dd>${pct(all[0]._dep).toFixed(1)}<small>%</small></dd></div>
    <div class="dp-kpi"><dt>${L("concTop5")}</dt><dd>${top5.reduce((a,r)=>a+pct(r._dep),0).toFixed(1)}<small>%</small></dd></div>
    <div class="dp-kpi"><dt>${L("concNeed80")}</dt><dd>${need80}<small>${lang==="EN"?"":"곳"}</small></dd></div>
  </div>
  <div class="dp-card">
    <div class="dp-head"><span class="dp-title">${L("concShare")}</span>
      <span class="dp-aside">${esc(periodLabel())} · ${fmtMoney(total)}</span></div>
    <div class="dp-stack">${stack}</div>
    <div class="dp-leg">${leg}</div>
    <p class="dp-note">${LF("concHead",all.length,need80)}
      ${appr?" "+LF("concApproved",appr,withDep):""}</p>
  </div>
  <div class="dp-card">
    <div class="dp-head"><span class="dp-title">${L("concClient")}</span>
      <span class="dp-aside">${LF("concClients",cl.length)}</span></div>
    <div class="dp-leg">${clHTML}</div>
    ${all.some(r=>r.noOnboarding)?`<p class="dp-note">${L("concSrcNote")}</p>`:""}
  </div>
  <div class="dp-card">
    <div class="dp-head"><span class="dp-title">${LF("concTable",rows.length)}</span>
      <span class="dp-aside">${L("concCum")}</span></div>
    <div class="dp-tw"><table class="dp-tbl">
      <thead><tr><th class="n">#</th><th>${L("colMerchant")}</th>
        <th>${esc(colLabel(colOf("group")))}</th>
        <th class="n">${L("colAmount")}</th><th class="n">%</th><th class="n">${L("concCum")}</th></tr></thead>
      <tbody>${tr}</tbody></table></div>
    <p class="dp-note">${L("concMark")} ${L("concGoNote")}</p>
  </div>`;
}

/* ---- 추이: 월별 입금액·머천트 수 ---- */
function trendHTML(){
  const meta=DEP();
  // 추이는 연도만 따른다. 한 달로 좁히면 막대가 하나 남아 추이가 아니게 된다.
  const ms=(meta.months||[]).filter(m=>!perYear || m.mo.slice(0,4)===perYear);
  if(!ms.length) return `<div class="dp-card"><p class="dp-note">${L("depEmpty")}</p></div>`;
  const hasAlt=(Number(meta.alt&&meta.alt.total)||0)>0;
  const hasUna=ms.some(m=>m.u>0);
  const ex=trendExTop && !hasAlt;   // 구 파트너가 있는 코리도는 2계열 비교가 우선이라 토글을 쓰지 않는다

  // w는 그 달 최대 머천트 기여분이라 sum을 넘을 수 없지만, 넘더라도 음수 금액을 찍지 않는다.
  const amt=m=>Math.max(0, ex?m.sum-m.w:m.sum);
  const rowTotal=m=>amt(m)+(hasAlt?m.a:0)+m.u;
  const mx=Math.max(1,...ms.map(rowTotal));
  const seg=(v,c)=>v>0?`<i style="width:${(v/mx*100).toFixed(2)}%;background:var(${c})" title="${fmtMoney(v)}"></i>`:"";
  const bars=ms.map(m=>`<div class="dp-bar"><span class="mo">${esc(m.mo.slice(2))}</span>
      <span class="tk">${seg(amt(m),"--accent")}${hasAlt?seg(m.a,"--muted"):""}${seg(m.u,"--s-vaw-d")}</span>
      <span class="v">${rowTotal(m)?fmtMoney(rowTotal(m)):"—"}</span></div>`).join("");

  const mmx=Math.max(1,...ms.map(m=>m.m));
  const mbars=ms.map(m=>`<div class="dp-bar"><span class="mo">${esc(m.mo.slice(2))}</span>
      <span class="tk">${m.m-m.nw>0?`<i style="width:${((m.m-m.nw)/mmx*100).toFixed(2)}%;background:var(--accent)"></i>`:""}${
        m.nw>0?`<i style="width:${(m.nw/mmx*100).toFixed(2)}%;background:var(--s-live-d)"></i>`:""}</span>
      <span class="v">${m.m||"—"}${m.nw?` <span style="color:var(--s-live-d)">+${m.nw}</span>`:""}</span></div>`).join("");

  const tr=ms.map(m=>`<tr><td>${esc(m.mo)}</td>
      <td class="n">${m.sum?fmtMoney(m.sum):"—"}</td>
      ${hasAlt?`<td class="n">${m.a?fmtMoney(m.a):"—"}</td>`:`<td class="n">${m.w?fmtMoney(m.w):"—"}</td>`}
      <td class="n">${m.n||"—"}</td><td class="n">${m.m||"—"}</td><td class="n">${m.nw||"—"}</td></tr>`).join("");

  const curLabel=(meta.cur&&meta.cur.label)||L("colAmount");
  const legend=[`<span><i style="background:var(--accent)"></i>${
      ex?L("trendExTop"):esc(curLabel)}</span>`]
    .concat(hasAlt?[`<span><i style="background:var(--muted)"></i>${esc(meta.alt.label)}</span>`]:[])
    .concat(hasUna?[`<span><i style="background:var(--s-vaw-d)"></i>${L("trendUnattr")}</span>`]:[]).join("");

  const toggle = hasAlt ? "" : `<span class="dp-mini">
      <button data-tm="all" class="${trendExTop?"":"on"}">${L("trendAll")}</button>
      <button data-tm="ex" class="${trendExTop?"on":""}">${L("trendExTop")}</button></span>`;

  const notes=[];
  if(hasAlt) notes.push(LF("trendAltNote",meta.alt.label));
  if(hasUna && meta.unattributed) notes.push(LF("trendUnattrNote",meta.unattributed.n,fmtMoney(meta.unattributed.sum)));
  if(!hasAlt && meta.topKey){
    // topKey는 집계용 정규화 키다. 보드에서 실제 이름을 찾아 보여준다.
    const hit=Store.rows().concat(orphanRows()).find(r=>depKeyOf(r)===meta.topKey);
    const label=hit?[hit[nameField()],hit.merchantId].filter(Boolean).join(" · "):meta.topKey;
    notes.push(`${L("trendExTop")}: <b>${esc(label)}</b> ${fmtMoney(meta.topSum)} (${depShare(meta.topSum).toFixed(1)}%)`);
  }

  return `
  <div class="dp-card">
    <div class="dp-head"><span class="dp-title">${L("trendAmount")}</span>
      <span class="dp-aside">${esc(periodLabel())}${perMonth?" · "+L("trendYearOnly"):""}</span>${toggle}</div>
    ${bars}
    <div class="dp-inline">${legend}</div>
    ${notes.length?`<p class="dp-note">${notes.join("<br>")}</p>`:""}
  </div>
  <div class="dp-card">
    <div class="dp-head"><span class="dp-title">${L("trendMerchants")}</span>
      <span class="dp-aside">${hasAlt?esc(curLabel)+" · ":""}${L("trendNewNote")}</span></div>
    ${mbars}
    <div class="dp-inline">
      <span><i style="background:var(--accent)"></i>${L("trendExisting")}</span>
      <span><i style="background:var(--s-live-d)"></i>${L("trendNew")}</span></div>
  </div>
  <div class="dp-card">
    <div class="dp-head"><span class="dp-title">${L("trendDetail")}</span>
      <span class="dp-aside">${fmtMoney(meta.total)} · ${meta.txns}${lang==="EN"?"":"건"}</span></div>
    <div class="dp-tw"><table class="dp-tbl">
      <thead><tr><th>${L("colMonth")}</th><th class="n">${L("colAmount")}</th>
        <th class="n">${hasAlt?esc(meta.alt.label):L("colTopMerchant")}</th>
        <th class="n">${L("colCount")}</th><th class="n">${L("colMerchants")}</th><th class="n">${L("trendNew")}</th></tr></thead>
      <tbody>${tr}</tbody></table></div>
  </div>`;
}

/* ---- 리드타임: 온보딩이 얼마나 걸리고, 끝난 뒤 돈은 언제 들어오나 ----
 * 요청→심사(우리 속도)와 심사→첫 입금(활성화)을 한 화면에 둔다. 둘은 "신청부터 돈까지"라는
 * 한 질문의 앞뒤 구간이라, 탭을 나누면 둘을 같이 보지 않게 된다.
 * 평균을 쓰지 않는다 — 191일 한 건이 평균을 혼자 끌어올려 111건의 실상을 가린다.
 *
 * 기간 필터를 타지 않는다. 저 선택은 "머천트별 매출"용이고 목록 화면에만 보이는데,
 * 연도 목록은 입금이 있는 연도로만 만들어진다(depYears). 입금은 2024년부터인데 온보딩은
 * 2026년부터라 2024를 고르면 이 탭이 통째로 비는 구멍이 생긴다.
 * 시간축은 아래 "월별 중위값"이 담당한다 — 나아지고 있나에 답하는 건 그쪽이다.
 */
const ymd = v => { const m=String(v??"").trim().match(/^(\d{4})-(\d{2})-(\d{2})/); return m?m[0]:""; };
function dayDiff(a,b){
  if(!ymd(a)||!ymd(b)) return null;
  return Math.round((Date.UTC(+b.slice(0,4),+b.slice(5,7)-1,+b.slice(8,10))
                    -Date.UTC(+a.slice(0,4),+a.slice(5,7)-1,+a.slice(8,10)))/864e5);
}
function todayYmd(){
  const d=new Date();
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
}
const median = a => { if(!a.length) return null; const s=[...a].sort((x,y)=>x-y), m=s.length>>1;
  return s.length%2 ? s[m] : Math.round((s[m-1]+s[m])/2*10)/10; };
const pctl = (a,p) => { if(!a.length) return null; const s=[...a].sort((x,y)=>x-y);
  return s[Math.max(0,Math.min(s.length-1,Math.ceil(p/100*s.length)-1))]; };
/* 시트가 계산한 소요일. 공란은 0이 아니라 "모름"이다 — 0으로 접으면 중위값이 내려간다. */
function slaOf(r){
  const f=CORR().slaField; if(!f) return null;
  const s=String(r[f]??"").trim(); if(!s) return null;
  const n=Number(s.replace(/[^\d.-]/g,""));
  return isFinite(n) && n>=0 ? n : null;
}
/* 이 코리도에 리드타임 탭을 띄울 데이터가 있나 */
function hasLead(){
  const a=CORR().actAnchor;
  return Store.rows().some(r=>slaOf(r)!=null || (a && ymd(r[a])));
}

function leadHTML(){
  const c=CORR(), nf=nameField(), gf=groupField(), today=todayYmd();
  const cards=[];

  /* ===== 1. 온보딩 소요일 (시트 SLA) ===== */
  if(c.slaField){
    const all=Store.rows().map(r=>{
      const d=slaOf(r); if(d==null) return null;
      // 심사가 끝난 달로 묶는다. 판정일이 비면 요청일로 떨어진다.
      const mo=(ymd(r[c.slaDateField])||ymd(r.requestDate)||"").slice(0,7);
      return { r, d, mo };
    }).filter(Boolean);

    if(all.length){
      const ds=all.map(x=>x.d);
      const byC={};
      all.forEach(x=>{ const k=x.r[gf]||L("noGroup"); (byC[k]=byC[k]||[]).push(x.d); });
      // 느린 순으로 세운다. 이 표를 보는 목적은 어디에 붙어야 하는지를 찾는 것이다.
      const cl=Object.keys(byC).filter(k=>byC[k].length>=3)
        .map(k=>[k,median(byC[k]),byC[k].length]).sort((a,b)=>b[1]-a[1]);
      const hidden=Object.keys(byC).length-cl.length;
      const cmx=Math.max(1,...cl.map(x=>x[1]));
      // 1일 대 191일이면 빠른 쪽 막대가 1.6%로 사실상 안 보인다. 최소 폭을 준다 —
      // "거의 없음"과 "없음"은 다르고, 빠른 클라이언트도 눈에 보여야 비교가 된다.
      const w=(v,mx)=>Math.max(3,v/mx*100).toFixed(1);
      const clBars=cl.map(([k,m,n])=>`<div class="dp-bar wide"><span class="mo" title="${esc(k)}">${esc(k)}</span>
          <span class="tk"><i style="width:${w(m,cmx)}%;background:var(${m>=60?"--s-rej-d":m>=30?"--s-vaw-d":"--accent"})"></i></span>
          <span class="v">${LF("leadDays",m)} · ${n}</span></div>`).join("");

      const byM={};
      all.forEach(x=>{ if(x.mo) (byM[x.mo]=byM[x.mo]||[]).push(x.d); });
      const mos=Object.keys(byM).sort();
      const mmx=Math.max(1,...mos.map(k=>median(byM[k])));
      const mBars=mos.map(k=>{ const m=median(byM[k]);
        return `<div class="dp-bar"><span class="mo">${esc(k.slice(2))}</span>
          <span class="tk"><i style="width:${w(m,mmx)}%;background:var(${m>=60?"--s-rej-d":m>=30?"--s-vaw-d":"--accent"})"></i></span>
          <span class="v">${LF("leadDays",m)} · ${byM[k].length}</span></div>`; }).join("");

      const SLOW=60;
      const slow=all.filter(x=>x.d>SLOW).sort((a,b)=>b.d-a.d);
      const slowRows=slow.map(x=>`<tr class="go" data-act="goto-merchant" data-id="${esc(x.r.id)}"
          data-q="${esc(x.r.merchantId||x.r[nf]||"")}" title="${esc(x.r[nf])}">
        <td class="nm">${esc(x.r[nf])||L("noName")}</td>
        <td class="fi">${esc(x.r[gf]||L("noGroup"))}</td>
        <td class="n">${LF("leadDays",x.d)}</td>
        <td class="n">${esc(x.mo||"—")}</td></tr>`).join("");

      cards.push(`
      <div class="dp-kpis">
        <div class="dp-kpi"><dt>${L("leadMed")}</dt><dd>${median(ds)}<small>${lang==="EN"?"d":"일"}</small></dd></div>
        <div class="dp-kpi"><dt>${L("leadP90")}</dt><dd>${pctl(ds,90)}<small>${lang==="EN"?"d":"일"}</small></dd></div>
        <div class="dp-kpi"><dt>${L("leadWorst")}</dt><dd>${Math.max(...ds)}<small>${lang==="EN"?"d":"일"}</small></dd></div>
      </div>
      <div class="dp-card">
        <div class="dp-head"><span class="dp-title">${L("leadByClient")}</span>
          <span class="dp-aside">${L("perAll")} · ${LF("leadSample",all.length)}</span></div>
        ${clBars}
        ${!cl.length||hidden?`<p class="dp-note">${L("leadClientNote")}</p>`:""}
      </div>
      ${mos.length>1?`<div class="dp-card">
        <div class="dp-head"><span class="dp-title">${L("leadByMonth")}</span>
          <span class="dp-aside">${L("leadSla")} · ${L("leadSlaSub")}</span></div>
        ${mBars}
        <p class="dp-note">${L("leadMonthNote")}</p>
      </div>`:""}
      ${slow.length?`<div class="dp-card">
        <div class="dp-head"><span class="dp-title">${LF("leadSlowTitle",SLOW)}</span>
          <span class="dp-aside">${LF("leadSample",slow.length)}</span></div>
        <div class="dp-tw"><table class="dp-tbl">
          <thead><tr><th>${L("colMerchant")}</th><th>${esc(colLabel(colOf("group")))}</th>
            <th class="n">${L("colDays")}</th><th class="n">${L("colMonth")}</th></tr></thead>
          <tbody>${slowRows}</tbody></table></div>
        <p class="dp-note">${L("leadGoNote")}</p>
      </div>`:""}`);
    }
  } else {
    cards.push(`<div class="dp-card"><p class="dp-note">${L("leadSlaKrwOnly")}</p></div>`);
  }

  /* ===== 2. 활성화 리드타임 (기준일 → 첫 입금) =====
   * depFirst는 기간 필터를 타지 않는다. "첫 입금"은 한 번뿐인 사실이라 선택 기간으로 바뀌면 안 된다. */
  const af=c.actAnchor;
  if(af){
    const acts=Store.rows().filter(r=>c.success.includes(r.status)).map(r=>{
      const a=ymd(r[af]); if(!a) return null;
      const age=dayDiff(a,today);
      if(age==null||age<0) return null;                 // 미래 날짜는 입력 오류다
      const f=ymd(r.depFirst);
      const raw=f?dayDiff(a,f):null;
      // 온보딩 기록 전부터 거래하던 곳은 음수가 나온다. 0일(이미 활성)로 본다.
      return { r, a, f, age, d:raw==null?null:Math.max(0,raw), pre:raw!=null&&raw<0 };
    }).filter(Boolean);

    if(acts.length){
      const done=acts.filter(x=>x.d!=null);
      const pre=done.filter(x=>x.pre).length;
      // 30일 내 활성화율의 분모는 "30일이 지난 곳"이다. 이번 주 승인 건까지 넣으면
      // 아직 기회가 없던 곳이 미활성으로 세어져 비율이 늘 내려간다.
      const ripe=acts.filter(x=>x.age>=30);
      const in30=ripe.filter(x=>x.d!=null&&x.d<=30).length;
      const pend=acts.filter(x=>x.d==null&&x.age>30).sort((a,b)=>b.age-a.age);
      const pendRows=pend.map(x=>`<tr class="go" data-act="goto-merchant" data-id="${esc(x.r.id)}"
          data-q="${esc(x.r.merchantId||x.r[nf]||"")}" title="${esc(x.r[nf])}">
        <td class="nm">${esc(x.r[nf])||L("noName")}</td>
        <td class="fi">${esc(x.r[gf]||L("noGroup"))}</td>
        <td class="n">${esc(x.a)}</td>
        <td class="n">${LF("leadDays",x.age)}</td></tr>`).join("");

      cards.push(`
      <div class="dp-kpis">
        <div class="dp-kpi"><dt>${L("leadActMed")}</dt><dd>${
          done.length?median(done.map(x=>x.d)):"—"}<small>${lang==="EN"?"d":"일"}</small></dd></div>
        <div class="dp-kpi"><dt>${L("leadAct30")}</dt><dd>${
          ripe.length?Math.round(in30/ripe.length*100):"—"}<small>%</small></dd></div>
        <div class="dp-kpi"><dt>${L("leadActPend")}</dt><dd>${pend.length}<small>${lang==="EN"?"":"곳"}</small></dd></div>
      </div>
      <div class="dp-card">
        <div class="dp-head"><span class="dp-title">${L("leadAct")}</span>
          <span class="dp-aside">${L(c.actAnchorLabel)} · ${L("perAll")}</span></div>
        <p class="dp-note">${LF("leadAct30Note",ripe.length)}${pre?" "+LF("leadPre",pre):""}</p>
      </div>
      ${pend.length?`<div class="dp-card">
        <div class="dp-head"><span class="dp-title">${L("leadPendTitle")}</span>
          <span class="dp-aside">${LF("leadSample",pend.length)}</span></div>
        <div class="dp-tw"><table class="dp-tbl">
          <thead><tr><th>${L("colMerchant")}</th><th>${esc(colLabel(colOf("group")))}</th>
            <th class="n">${(()=>{const col=c.columns.find(x=>x.field===af);
              // KRW 판정일은 목록 컬럼이 아니라(§8) 라벨이 없다. 구간 이름으로 대신 쓴다.
              return esc(col?colLabel(col):L(c.actAnchorLabel).split(/\s*→\s*/)[0]);})()}</th>
            <th class="n">${L("colWaited")}</th></tr></thead>
          <tbody>${pendRows}</tbody></table></div>
        <p class="dp-note">${L("leadPendNote")} ${L("leadGoNote")}</p>
      </div>`:""}`);
    }
  }

  return cards.length ? cards.join("") : `<div class="dp-card"><p class="dp-note">${L("leadEmpty")}</p></div>`;
}

function renderTabs(){
  $("#tabs").innerHTML=Object.keys(CORRIDORS).map(k=>{
    const n=(Store.data[k]||[]).length;
    return `<button data-tab="${k}" class="${active===k?'on':''}">${CORRIDORS[k].label}<span class="tcnt">${n}</span></button>`;
  }).join("");
}
function renderChips(){
  const rows=Store.rows();
  const attnTotal=rows.filter(r=>isAttention(r)).length;
  const noDepTotal=rows.filter(r=>isNoDeposit(r)).length;
  const apprTotal=rows.filter(r=>CORR().success.includes(r.status)).length;
  let html=`<button class="chip ${filter==='all'?'on':''}" data-filter="all">${L("all")} <span class="cnt">${rows.length}</span></button>`;
  if(attnTotal) html+=`<button class="chip ${filter==='attention'?'on':''}" data-filter="attention"><span class="dot" style="background:var(--s-vaw-d)"></span>${L("attention")} <span class="cnt">${attnTotal}</span></button>`;
  if(noDepTotal) html+=`<button class="chip chip-dep ${filter==='nodeposit'?'on':''}" data-filter="nodeposit"><span class="dot" style="background:var(--s-vaw-d)"></span>${L("noDeposit")} <span class="cnt">${noDepTotal}</span></button>`;
  if(apprTotal) html+=`<span class="act-pill" title="${L("activation")}">${L("activation")} <b>${apprTotal-noDepTotal}/${apprTotal}</b> <i>${Math.round((apprTotal-noDepTotal)/apprTotal*100)}%</i></span>`;
  CORR().statuses.forEach(s=>{
    const n=rows.filter(r=>r.status===s.v).length;
    if(n===0 && filter!==s.v) return;
    const t=TONES[s.tone];
    html+=`<button class="chip ${filter===s.v?'on':''}" data-filter="${esc(s.v)}"><span class="dot" style="background:var(${t.d})"></span>${esc(s.v)} <span class="cnt">${n}</span></button>`;
  });
  $("#chips").innerHTML=html;
}

/* 뷰 전환 한 곳. Status/Forecast 밴드 + 대시보드 버튼 + 분석 탭이 세 군데 흩어져 있던 것을 합쳤다.
   Concentration·Trend는 입금 데이터가 없으면 항목 자체를 내린다. */
function navItems(){
  const hasDep = (Number(DEP().total)||0) > 0;
  const items = [["list", L("dvList")]];
  if(hasDep) items.push(["conc", L("dvConc")], ["trend", L("dvTrend")]);
  if(hasLead()) items.push(["lead", L("dvLead")]);
  items.push(["dash", L("dvDash")], ["forecast", L("dvForecast")]);
  return items;
}
function currentNav(){
  if(forecastMode) return "forecast";
  if(dashMode) return "dash";
  return depView;
}
function renderViewNav(){
  const cur = currentNav();
  const nav = $("#viewNav");
  nav.innerHTML = navItems()
    .map(([v,label])=>`<button data-nav="${v}" class="${cur===v?"on":""}">${esc(label)}</button>`).join("");
  // 탭이 6개가 되어 폰에서는 줄이 넘친다. 선택된 탭이 화면 밖이면 보이는 곳까지 당긴다.
  // scrollIntoView는 세로로도 움직여 헤더가 튀므로 가로 위치만 직접 맞춘다.
  const on = nav.querySelector("button.on");
  if(on && nav.scrollWidth > nav.clientWidth){
    const l=on.offsetLeft, r=l+on.offsetWidth;
    if(l < nav.scrollLeft) nav.scrollLeft = Math.max(0, l-12);
    else if(r > nav.scrollLeft+nav.clientWidth) nav.scrollLeft = r-nav.clientWidth+12;
  }
}
function gotoView(v){
  forecastMode = v==="forecast";
  dashMode     = v==="dash";
  depView      = (v==="conc"||v==="trend"||v==="lead") ? v : "list";
  if(forecastMode){ renderForecast(); renderViewNav(); }
  else render();
  window.scrollTo(0,0);
}
$("#viewNav").addEventListener("click",e=>{
  const b=e.target.closest("button"); if(!b)return;
  gotoView(b.dataset.nav);
});

$("#list").addEventListener("click",e=>{
  const el=e.target.closest("[data-act]"); if(!el)return;
  const act=el.dataset.act;
  if(act==="copy-va"){ e.stopPropagation(); clipCopy(el.dataset.va, L("vaCopied")); return; }
  if(act==="copy-summary"){ e.stopPropagation(); const r=Store.rows().concat(orphanRows()).find(x=>x.id===el.dataset.id); if(r) clipCopy(buildSummary(r), L("summaryCopied")); return; }
  if(act==="link") return;
  const groupEl=e.target.closest(".group"), itemEl=e.target.closest(".item");
  const g=groupEl?.dataset.g, id=itemEl?.dataset.id;
  if(act==="tg-group"){ if(query||filter!=="all")return; const k=active+"|"+g; openGroups.has(k)?openGroups.delete(k):openGroups.add(k); groupEl.classList.toggle("open"); return; }
  if(act==="tg-item"){ const k=active+"|"+id; openItems.has(k)?openItems.delete(k):openItems.add(k); itemEl.classList.toggle("open"); return; }
});

/* ============================ Dashboard ============================ */

function isoWeekStart(d){
  const dt=new Date(d); const day=dt.getDay();
  dt.setDate(dt.getDate()-((day+6)%7));
  return dt.toISOString().slice(0,10);
}

function renderDash(){
  const rows=Store.rows(), gf=groupField();
  const success=CORR().success||[];
  const isAppr=r=>success.indexOf(r.status)>=0;
  const dated=rows.filter(r=>r.requestDate).map(r=>({r,d:new Date(r.requestDate)})).filter(x=>!isNaN(x.d));
  const noDate=`<div style="color:var(--muted);font-size:13px;text-align:center;padding:20px 0">${L("dashNoDate")}</div>`;

  const week=getWeekRange();
  const weekRows=rows.filter(r=>r.requestDate&&r.requestDate>=week.start&&r.requestDate<=week.end);
  const weekAppr=weekRows.filter(isAppr).length;
  const weekRate=weekRows.length?Math.round(weekAppr/weekRows.length*100):0;

  const weekMap={};
  dated.forEach(x=>{const k=isoWeekStart(x.d);weekMap[k]=(weekMap[k]||0)+1;});
  const weeks=Object.keys(weekMap).sort();
  const weekData=weeks.map(w=>({week:w,count:weekMap[w]}));
  let cum=0; weekData.forEach(w=>{cum+=w.count; w.cum=cum;});

  const weekClientMap={};
  weekRows.forEach(r=>{const g=r[gf]||L("noGroup");const o=weekClientMap[g]||(weekClientMap[g]={t:0,a:0});o.t++;if(isAppr(r))o.a++;});
  const weekClients=Object.entries(weekClientMap).map(([n,o])=>({name:n,t:o.t,a:o.a,rate:o.t?Math.round(o.a/o.t*100):0})).sort((a,b)=>b.t-a.t);

  const monthMap={};
  dated.forEach(x=>{const k=x.r.requestDate.slice(0,7);monthMap[k]=(monthMap[k]||0)+1;});
  const months=Object.keys(monthMap).sort();
  const monthData=months.map(m=>({month:m,count:monthMap[m]}));

  const apprAll=rows.filter(isAppr).length;
  const rateAll=rows.length?Math.round(apprAll/rows.length*100):0;
  const apM={};
  dated.forEach(x=>{const k=x.r.requestDate.slice(0,7);const o=apM[k]||(apM[k]={t:0,a:0});o.t++;if(isAppr(x.r))o.a++;});
  const apMonths=Object.keys(apM).sort();
  const apC={};
  rows.forEach(r=>{const g=r[gf]||L("noGroup");const o=apC[g]||(apC[g]={t:0,a:0});o.t++;if(isAppr(r))o.a++;});
  const apClients=Object.entries(apC).map(([n,o])=>({name:n,rate:o.t?Math.round(o.a/o.t*100):0,a:o.a,t:o.t})).sort((x,y)=>y.rate-x.rate||y.t-x.t);

  let h='';

  const statusCounts={};
  CORR().statuses.forEach(s=>{ statusCounts[s.v]=rows.filter(r=>r.status===s.v).length; });
  const funnelStatuses=CORR().statuses.filter(s=>s.tone!=="rose");
  const failStatuses=CORR().statuses.filter(s=>s.tone==="rose");

  h+=`<div style="font-size:13px;font-weight:700;color:var(--muted);letter-spacing:.04em;padding:4px 2px 10px">${L("dashFunnelSection")}</div>`;
  h+=`<div class="funnel-summary">`;
  h+=`<div class="funnel-stat"><div class="funnel-stat-val">${rows.length}</div><div class="funnel-stat-lbl">${L("dashFunnelTotal")}</div></div>`;
  h+=`<div class="funnel-stat"><div class="funnel-stat-val" style="color:var(--s-live-t)">${apprAll}</div><div class="funnel-stat-lbl">${success.join("/")}</div></div>`;
  h+=`<div class="funnel-stat"><div class="funnel-stat-val" style="color:var(--s-live-t)">${rateAll}%</div><div class="funnel-stat-lbl">${L("dashFunnelRate")}</div></div>`;
  h+=`</div>`;

  const totalRows=rows.length||1;
  h+=`<div class="dash-card">`;
  CORR().statuses.forEach((s,i)=>{
    const n=statusCounts[s.v]||0, t=TONES[s.tone], pct=Math.round(n/totalRows*100);
    const isFail=s.tone==="rose";

function renderWeeklyChart(data){
  const W=560,H=200,pad={t:24,r:10,b:38,l:36};
  const cw=W-pad.l-pad.r, ch=H-pad.t-pad.b;
  const n=data.length;
  const barW=Math.min(Math.floor(cw/n*0.6),36);
  const gap=(cw-barW*n)/(n+1);
  const maxY=Math.max(...data.map(d=>d.cum),1);
  const gridN=4;
  let s=`<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg">`;
  for(let i=0;i<=gridN;i++){
    const y=pad.t+ch-(ch/gridN*i), v=Math.round(maxY/gridN*i);
    s+=`<line x1="${pad.l}" y1="${y}" x2="${W-pad.r}" y2="${y}" stroke="var(--border)" stroke-width="0.5"/>`;
    s+=`<text x="${pad.l-6}" y="${y+3}" text-anchor="end" fill="var(--muted)" font-size="9" font-family="var(--mono)">${v}</text>`;
  }
  data.forEach((d,i)=>{
    const x=pad.l+gap+i*(barW+gap);
    const bH=Math.max((d.count/maxY)*ch,2);
    const y=pad.t+ch-bH;
    s+=`<rect x="${x}" y="${y}" width="${barW}" height="${bH}" rx="3" fill="var(--accent-tint)" stroke="var(--accent)" stroke-width="0.8"/>`;
    s+=`<text x="${x+barW/2}" y="${pad.t+ch-bH-4}" text-anchor="middle" fill="var(--accent)" font-size="8" font-weight="700" font-family="var(--mono)">${d.count}</text>`;
    const lbl=d.week.slice(5);
    s+=`<text x="${x+barW/2}" y="${H-pad.b+14}" text-anchor="middle" fill="var(--muted)" font-size="8" font-family="var(--mono)">${lbl}</text>`;
  });
  const pts=data.map((d,i)=>{
    const x=pad.l+gap+i*(barW+gap)+barW/2;
    const y=pad.t+ch-(d.cum/maxY)*ch;
    return `${x},${y}`;
  }).join(' ');
  s+=`<polyline points="${pts}" fill="none" stroke="var(--s-live-d)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>`;
  data.forEach((d,i)=>{
    const x=pad.l+gap+i*(barW+gap)+barW/2;
    const y=pad.t+ch-(d.cum/maxY)*ch;
    s+=`<circle cx="${x}" cy="${y}" r="3" fill="var(--surface)" stroke="var(--s-live-d)" stroke-width="1.5"/>`;
    if(i===n-1||n<=12) s+=`<text x="${x}" y="${y-8}" text-anchor="middle" fill="var(--s-live-t)" font-size="9" font-weight="700" font-family="var(--mono)">${d.cum}</text>`;
  });
  s+='</svg>';
  return `<div class="dash-chart">${s}</div>`;
}

async function fetchForecast(){
  if(!Auth.loggedIn||!BACKEND_URL) return;
  if(forecastData){ renderForecast(); return; }
  $("#forecastPanel").innerHTML=`<div class="fc-loading">${L("fcLoading")}</div>`;
  try{
    const url=BACKEND_URL+"?token="+encodeURIComponent(Auth.token)+"&action=forecast";
    const r=await fetch(url);
    const j=await r.json();
    if(j.error) return;
    forecastData=j;
    renderForecast();
  }catch(e){ console.error("forecast fetch",e); $("#forecastPanel").innerHTML=`<div class="fc-loading">${L("fcFetchFail")}</div>`; }
}

function renderForecast(){
  $(".search").style.display="none";
  $("#chips").style.display="none";
  $(".toolbar").style.display="none";
  $("#list").style.display="none";
  $("#dashboard").style.display="none";
  $("#depPanel").style.display="none";
  $("#forecastPanel").style.display="";
  if(!forecastData){ fetchForecast(); return; }
  const d=forecastData[active];
  const panel=$("#forecastPanel");
  if(!d||!d.clients){ panel.innerHTML=`<div class="fc-loading">${L("fcNoData")}</div>`; return; }
  const MN=L("fcMonths");
  const now=new Date(), cm=now.getMonth();
  const clients=d.clients, months=d.months||[];
  const mp=new Array(12).fill(0), ma=new Array(12).fill(0);
  months.forEach(m=>{ const i=m.month-1; if(i<0||i>11)return; m.prediction.forEach(v=>{mp[i]+=v;}); m.actual.forEach(v=>{ma[i]+=v;}); });
  const sr=(a,f,t)=>{let s=0;for(let i=f;i<=t&&i<a.length;i++)s+=a[i];return s;};
  const yp=sr(mp,0,cm), ya=sr(ma,0,cm);
  const tp=d.total&&d.total.prediction?d.total.prediction.reduce((a,b)=>a+b,0):mp.reduce((a,b)=>a+b,0);
  const ta=d.total&&d.total.actual?d.total.actual.reduce((a,b)=>a+b,0):ma.reduce((a,b)=>a+b,0);
  const acc=yp>0?(ya/yp*100):0;
  const yPct=tp>0?(ta/tp*100):0;
  const diff=ya-yp, ds=diff>=0?'+':'';
  let h='';
  h+=`<div class="fc-summary">
    <div class="fc-stat"><div class="fc-lbl">Prediction</div><div class="fc-val" style="color:var(--accent)">${yp}</div><div class="fc-sub">YTD (${MN[cm]}${L("fcUntil")?` ${L("fcUntil")}`:``})</div></div>
    <div class="fc-stat"><div class="fc-lbl">Actual</div><div class="fc-val" style="color:${ya>yp?'var(--s-rej-d)':'var(--s-live-d)'}">${ya}</div><div class="fc-sub">${ds}${diff}${L("fcItems")}</div></div>
    <div class="fc-stat"><div class="fc-lbl">Accuracy</div><div class="fc-val" style="color:${acc>=80?'var(--s-live-d)':acc>=30?'var(--s-rev-d)':'var(--s-rej-d)'}">${acc.toFixed(1)}%</div><div class="fc-sub">Actual / Pred</div></div>
  </div>`;
  h+=`<div class="fc-ytd"><div class="fc-ytd-lbl">${L("fcYtd")}</div><div class="fc-ytd-bar"><div class="fc-ytd-fill" style="width:${Math.min(yPct,100).toFixed(1)}%"></div></div><div class="fc-ytd-pct">${yPct.toFixed(1)}%</div></div>`;
  const mx=Math.max(...mp.slice(0,cm+1),...ma.slice(0,cm+1),1);
  h+=`<div class="fc-sec">${L("fcMonthlyChart")}</div><div class="fc-chart">`;
  for(let i=0;i<=cm;i++){
    const pW=mp[i]/mx*100, aW=ma[i]/mx*100, over=ma[i]>mp[i];
    h+=`<div class="fc-mrow"><div class="fc-mlbl">${MN[i]}</div><div class="fc-mbars"><div class="fc-mbar" style="width:${Math.max(pW,1)}%;background:var(--accent);opacity:.25"></div><div class="fc-mbar" style="width:${Math.max(aW,1)}%;background:${over?'var(--s-rej-d)':'var(--s-live-d)'}"></div></div><div class="fc-mval">${mp[i]} / ${ma[i]}</div></div>`;
  }
  h+=`<div class="fc-legend"><span><div class="fc-dot" style="background:var(--accent);opacity:.35"></div>Prediction</span><span><div class="fc-dot" style="background:var(--s-live-d)"></div>Actual</span><span><div class="fc-dot" style="background:var(--s-rej-d)"></div>${L("fcOver")}</span></div></div>`;
  const cd=clients.map((name,ci)=>{let p=0,a=0;months.forEach(m=>{if(m.month-1<=cm){p+=m.prediction[ci]||0;a+=m.actual[ci]||0;}});const ac=p>0?(a/p*100):(a>0?999:0);return{name,pred:p,actual:a,acc:ac};}).filter(c=>c.pred>0||c.actual>0).sort((a,b)=>b.actual-a.actual);
  h+=`<div class="fc-sec">${L("fcClientSection")}</div><div class="fc-tbl"><table><tr><th>Client</th><th>Pred</th><th>Actual</th><th>Accuracy</th></tr>`;
  cd.forEach(c=>{const cls=c.acc>=80?'fc-bg':c.acc>=30?'fc-by':c.acc>0?'fc-br':'fc-by';const at=c.pred===0&&c.actual>0?'N/A':c.acc>=999?'N/A':c.acc.toFixed(0)+'%';h+=`<tr><td>${esc(c.name)}</td><td>${c.pred}</td><td style="font-weight:700">${c.actual}</td><td><span class="fc-badge ${cls}">${at}</span></td></tr>`;});
  h+=`</table></div>`;
  h+=`<div class="fc-sec">${L("fcMonthDetail")}</div>`;
  for(let i=cm;i>=0;i--){
    const m=months.find(x=>x.month===i+1); if(!m) continue;
    const mP=m.prediction.reduce((a,b)=>a+b,0), mA=m.actual.reduce((a,b)=>a+b,0);
    const mAcc=mP>0?(mA/mP*100).toFixed(0):'-';
    const bc=mAcc==='-'?'fc-by':parseInt(mAcc)>=80?'fc-bg':parseInt(mAcc)>=30?'fc-by':'fc-br';
    h+=`<div class="fc-detail" onclick="this.classList.toggle('open')"><div class="fc-dh"><div class="fc-dt">${MN[i]} — Pred ${mP} / Actual ${mA}</div><span class="fc-badge ${bc}">${mAcc==='-'?'-':mAcc+'%'}</span></div><div class="fc-db">`;
    clients.forEach((name,ci)=>{const p=m.prediction[ci]||0,a=m.actual[ci]||0;if(!p&&!a)return;h+=`<div class="fc-drow"><span class="fc-dn">${esc(name)}</span><div class="fc-dv"><span>P: ${p}</span><span style="font-weight:700">A: ${a}</span></div></div>`;});
    h+=`</div></div>`;
  }
  panel.innerHTML=h;
}

/* ============================ Weekly Report ============================ */
function getWeekRange(){
  const now=new Date(), day=now.getDay();
  const mon=new Date(now); mon.setDate(now.getDate()-((day+6)%7));
  const sun=new Date(mon); sun.setDate(mon.getDate()+6);
  const fmt=d=>d.toISOString().slice(0,10);
  return {start:fmt(mon), end:fmt(sun), label:fmt(mon)+" ~ "+fmt(sun)};
}
function buildWeeklyReport(){
  const week=getWeekRange();
  const rows=Store.rows(), gf=groupField(), nf=nameField();
  const success=CORR().success||[];
  const isAppr=r=>success.indexOf(r.status)>=0;
  const weekRows=rows.filter(r=>r.requestDate&&r.requestDate>=week.start&&r.requestDate<=week.end);
  const apprAll=rows.filter(isAppr).length;
  const rateAll=rows.length?Math.round(apprAll/rows.length*100):0;
  const apprWeek=weekRows.filter(isAppr).length;
  const rateWeek=weekRows.length?Math.round(apprWeek/weekRows.length*100):0;
  const statusMap={};
  rows.forEach(r=>{const s=r.status||"—";statusMap[s]=(statusMap[s]||0)+1;});
  const clientMap={};
  rows.forEach(r=>{const g=r[gf]||L("noGroup");const o=clientMap[g]||(clientMap[g]={t:0,a:0});o.t++;if(isAppr(r))o.a++;});
  const attnRows=rows.filter(r=>isAttention(r));
  const nl="\n";
  let t="";
  t+=`[${L("reportTitle")}] ${active}${nl}`;
  t+=`${L("reportPeriod")}: ${week.label}${nl}`;
  t+=`────────────────────────${nl}${nl}`;
  t+=`■ ${L("reportSummary")}${nl}`;
  t+=`  ${L("reportTotal")}: ${rows.length}${L("reportItems")}${nl}`;
  t+=`  ${L("reportThisWeek")}: ${weekRows.length}${L("reportItems")}${nl}`;
  t+=`  ${L("reportApprovalRate")} (${L("reportTotal")}): ${apprAll}/${rows.length} (${rateAll}%)${nl}`;
  if(weekRows.length) t+=`  ${L("reportApprovalRate")} (${L("reportThisWeek")}): ${apprWeek}/${weekRows.length} (${rateWeek}%)${nl}`;
  t+=nl;
  t+=`■ ${L("reportStatusBreak")}${nl}`;
  CORR().statuses.forEach(s=>{const n=statusMap[s.v]||0; t+=`  ${s.v}: ${n}${L("reportItems")}${nl}`;});
  t+=nl;
  t+=`■ ${L("reportClientBreak")}${nl}`;
  Object.entries(clientMap).sort((a,b)=>b[1].t-a[1].t).forEach(([n,o])=>{
    const r=o.t?Math.round(o.a/o.t*100):0;
    t+=`  ${n}: ${o.t}${L("reportItems")} (${L("reportApproved")} ${o.a}, ${r}%)${nl}`;
  });
  t+=nl;
  t+=`■ ${L("reportAttention")}${nl}`;
  if(!attnRows.length) t+=`  ${L("reportNoAttention")}${nl}`;
  else attnRows.slice(0,10).forEach(r=>{t+=`  - ${r[nf]||"—"}${r.merchantId?" ("+r.merchantId+")":""} · ${r.status}${nl}`;});
  if(attnRows.length>10) t+=`  ... +${attnRows.length-10}${L("reportItems")}${nl}`;
  return {text:t, subject:`[SMOS] ${L("reportTitle")} ${active} (${week.label})`};
}
function openWeeklyReport(){
  const rpt=buildWeeklyReport();
  const previewHtml=esc(rpt.text).replace(/\n/g,"<br>");
  openModal(`<h2>${L("reportTitle")} · ${active}</h2>
    <div class="msub">${getWeekRange().label}</div>
    <div style="background:var(--surface-2);border:1px solid var(--border);border-radius:10px;padding:14px;font-size:12.5px;font-family:var(--mono);line-height:1.7;max-height:50vh;overflow-y:auto;white-space:pre-wrap;word-break:break-word;margin-bottom:14px;">${previewHtml}</div>
    <div class="modal-actions">

      <button class="save" id="btnReportCopy" style="flex:1">${L("reportCopy")}</button>
      <button class="save" id="btnReportEmail" style="flex:1.2;background:var(--s-live-d)">${L("reportEmail")}</button>
    </div>`);
  modal.querySelector("[data-close]").onclick=closeModal;

    window.open(mailto,"_blank");
  };
}

function toCSV(){
  const cols=CORR().columns;
  const cur=CORR().currency;
  const dep=[{field:"depSum",header:"Deposit Amount ("+cur+")"},
             {field:"depCnt",header:"Deposit Count"},
             {field:"depLast",header:"Last Deposit"}];
  const all=cols.concat(dep);
  // Excel·Sheets는 = + - @ 또는 제어문자로 시작하는 셀을 수식으로 실행한다. 머천트명·메모는
  // 시트와 입금 원천에서 오는 값이라, 내보낸 CSV를 누가 열면 그대로 돌아간다. 숫자는 건드리지 않는다.
  const q=v=>{
    v=String(v??"");
    if(/^[=+\-@\t\r]/.test(v) && !/^-?[\d,]+(\.\d+)?$/.test(v)) v="'"+v;
    return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;
  };
  const lines=[all.map(c=>q(c.header)).join(",")];
  Store.rows().forEach(r=>{
    const dp=depOf(r);
    const v={depSum:dp.sum, depCnt:dp.cnt, depLast:dp.last};
    lines.push(all.map(c=>q(c.field in v ? v[c.field] : r[c.field])).join(","));
  });
  return lines.join("\r\n");
}
function download(name,content,type){ const b=new Blob([content],{type}); const a=document.createElement("a"); a.href=URL.createObjectURL(b); a.download=name; a.click(); URL.revokeObjectURL(a.href); }
$("#btnExportCsv").addEventListener("click",()=>{ download(`SMOS_${active}_${new Date().toISOString().slice(0,10)}.csv`, "﻿"+toCSV(), "text/csv;charset=utf-8"); toast(`${active} ${L("csvExported")}`); });
$("#btnExportJson").addEventListener("click",()=>{ download(`SMOS_backup_${new Date().toISOString().slice(0,10)}.json`, JSON.stringify(Store.data,null,2), "application/json"); toast(L("jsonBackup")); });

function hideApp(){
  $("#loginScreen").classList.remove("hidden");
  $("#appWrap").style.display="none";
  $("#userPill").style.display="none";
}
function doLogout(){
  Auth.clear();
  Store.data={KRW:[],VND:[]}; Store.online=false; Store.authError=false;
  if(pollTimer){ clearInterval(pollTimer); pollTimer=null; }
  if(syncTimer){ clearInterval(syncTimer); syncTimer=null; }
  google.accounts.id.disableAutoSelect();
  hideApp();
}
$("#userPill").addEventListener("click", ()=>{
  openModal(`<h2>${L("logout")}</h2><div class="msub">${Auth.email||""}</div>
    <div class="modal-actions"><button class="cancel" data-close>${L("close")}</button><button class="save" id="btnLogoutConfirm">${L("logoutYes")}</button></div>`);
  modal.querySelector("[data-close]").onclick=closeModal;
  $("#btnLogoutConfirm").onclick=()=>{ closeModal(); doLogout(); };
});

async function onLogin(credential){
  Auth.set(credential);
  const errEl=$("#loginError");
  errEl.classList.remove("show");
  await Store.load();
  if(Store.authError){
    const msg = Store.authError==="forbidden" ? L("forbidden") : L("authError");
    errEl.textContent=msg; errEl.classList.add("show");
    Auth.clear();
    return;
  }
  showApp(); render(); startPolling(); if(syncTimer) clearInterval(syncTimer); syncTimer=setInterval(updateSync, 15000);
}

function initGIS(){
  google.accounts.id.initialize({
    client_id: GOOGLE_CLIENT_ID,
    callback: (resp)=>{ if(resp.credential) onLogin(resp.credential); },
    auto_select: true,
  });
  google.accounts.id.renderButton($("#gsiButtonWrap"),{type:"standard",theme:"outline",size:"large",text:"signin_with",shape:"pill",width:280});
  google.accounts.id.prompt();
}

(function waitGIS(){
  if(typeof google!=="undefined" && google.accounts && google.accounts.id){ initGIS(); }
  else { setTimeout(waitGIS, 100); }
})();
</script>
</body>
